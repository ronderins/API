<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="aegis-grad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="aegis-facet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="aegis-inner" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="aegis-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Backing Shield Plate -->
  <path
    d="M50 8 L84 24 V52 C84 72 68 88 50 94 C32 88 16 72 16 52 V24 L50 8 Z"
    fill="url(#aegis-facet)"
    stroke="#065f46"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Left Protective Wing / Facet -->
  <path
    d="M50 8 L16 24 V52 C16 72 32 88 50 94 V8 Z"
    fill="#047857"
    fill-opacity="0.25"
  />

  <!-- Right Protective Wing Highlight -->
  <path
    d="M50 8 L84 24 V52 C84 72 68 88 50 94 V8 Z"
    fill="#10b981"
    fill-opacity="0.1"
  />

  <!-- Outer Shield Outline Accent with Gradient -->
  <path
    d="M50 11 L81 25.5 V50 C81 68 67 83 50 89 C33 83 19 68 19 50 V25.5 L50 11 Z"
    stroke="url(#aegis-grad)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#aegis-glow)"
  />

  <!-- Interlocking Cryptographic Core -->
  <path
    d="M50 25 L68 37 L50 49 L32 37 Z"
    fill="url(#aegis-inner)"
    stroke="#a7f3d0"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <path
    d="M50 53 L66 41 V56 C66 67 59 74 50 78 C41 74 34 67 34 56 V41 L50 53 Z"
    fill="url(#aegis-grad)"
    stroke="#34d399"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- Central Core Attestation Diamond -->
  <circle cx="50" cy="49" r="4.5" fill="#ffffff" />
  <circle cx="50" cy="49" r="2" fill="#065f46" />
</svg>
