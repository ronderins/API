<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="neonAuditGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <style>
    @keyframes auditShine {
      0%, 100% { filter: drop-shadow(0 0 2px #34d399); }
      50% { filter: drop-shadow(0 0 6px #38bdf8); }
    }
    .neon-audit { animation: auditShine 2.5s ease-in-out infinite; }
  </style>
  <g class="neon-audit" fill="none" stroke="url(#neonAuditGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Magnifier Lens -->
    <circle cx="13" cy="13" r="8.5" fill="none" />
    <!-- Handle -->
    <line x1="19.5" y1="19.5" x2="28" y2="28" stroke-width="2.8" />
    <!-- Verified Checkmark Inside Lens -->
    <polyline points="9 13 12 16 17 10" stroke="#34d399" stroke-width="2" />
  </g>
</svg>
