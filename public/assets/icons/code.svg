<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="neonCodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <style>
    @keyframes codeShine {
      0%, 100% { filter: drop-shadow(0 0 2px #c084fc); }
      50% { filter: drop-shadow(0 0 6px #a855f7); }
    }
    .neon-code { animation: codeShine 2.4s ease-in-out infinite; }
  </style>
  <g class="neon-code" fill="none" stroke="url(#neonCodeGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="10 8 3 16 10 24" />
    <polyline points="22 8 29 16 22 24" />
    <line x1="19" y1="5" x2="13" y2="27" stroke="#38bdf8" stroke-width="1.8" />
  </g>
</svg>
