<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="neonArchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>
  <style>
    @keyframes archPulse {
      0%, 100% { filter: drop-shadow(0 0 2px #38bdf8) drop-shadow(0 0 6px rgba(129, 140, 248, 0.6)); }
      50% { filter: drop-shadow(0 0 4px #c084fc) drop-shadow(0 0 10px rgba(56, 189, 248, 0.9)); }
    }
    @keyframes nodeFlow {
      0% { stroke-dashoffset: 20; }
      100% { stroke-dashoffset: 0; }
    }
    .neon-arch { animation: archPulse 3s ease-in-out infinite; }
    .flow-link { stroke-dasharray: 4 3; animation: nodeFlow 2s linear infinite; }
  </style>
  <g class="neon-arch" fill="none" stroke="url(#neonArchGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Hub Node -->
    <circle cx="16" cy="7" r="4.5" fill="none" stroke="#38bdf8" />
    <circle cx="16" cy="7" r="1.5" fill="none" stroke="#818cf8" />
    <!-- Bottom Left Node -->
    <circle cx="7" cy="25" r="4.5" fill="none" stroke="#818cf8" />
    <!-- Bottom Right Node -->
    <circle cx="25" cy="25" r="4.5" fill="none" stroke="#c084fc" />
    <!-- Connection lines -->
    <path d="M 16 12 L 16 18 L 7 18 L 7 20" class="flow-link" stroke="#38bdf8" />
    <path d="M 16 18 L 25 18 L 25 20" class="flow-link" stroke="#c084fc" />
  </g>
</svg>
