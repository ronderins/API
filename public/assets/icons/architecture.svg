<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="neonArchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <style>
    @keyframes archShine {
      0%, 100% { filter: drop-shadow(0 0 2px #38bdf8); }
      50% { filter: drop-shadow(0 0 5px #818cf8); }
    }
    .neon-arch { animation: archShine 2.6s ease-in-out infinite; }
  </style>
  <g class="neon-arch" fill="none" stroke="url(#neonArchGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Hub Node -->
    <rect x="12" y="4" width="8" height="6" rx="1.5" />
    <!-- Bottom Nodes -->
    <rect x="4" y="22" width="8" height="6" rx="1.5" />
    <rect x="20" y="22" width="8" height="6" rx="1.5" />
    <!-- Connectors -->
    <path d="M 16 10 L 16 16 L 8 16 L 8 22" />
    <path d="M 16 16 L 24 16 L 24 22" />
  </g>
</svg>
