<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="neonShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <style>
    @keyframes shieldShimmer {
      0%, 100% { filter: drop-shadow(0 0 2px #34d399) drop-shadow(0 0 5px rgba(16, 185, 129, 0.6)); stroke-width: 1.8; }
      50% { filter: drop-shadow(0 0 5px #06b6d4) drop-shadow(0 0 10px rgba(52, 211, 153, 0.9)); stroke-width: 2.2; }
    }
    .neon-shield { animation: shieldShimmer 2.6s ease-in-out infinite; }
  </style>
  <g class="neon-shield" fill="none" stroke="url(#neonShieldGrad)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 16 3 C 22 5, 27 6, 27 13 C 27 21, 21 27, 16 29 C 11 27, 5 21, 5 13 C 5 6, 10 5, 16 3 Z" fill="#041d16" />
    <circle cx="16" cy="14" r="3.5" fill="#10b981" />
    <path d="M 16 17.5 L 16 22" />
  </g>
</svg>
