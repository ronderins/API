<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="neonCollabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <style>
    @keyframes branchShine {
      0%, 100% { filter: drop-shadow(0 0 2px #f43f5e); }
      50% { filter: drop-shadow(0 0 5px #ec4899); }
