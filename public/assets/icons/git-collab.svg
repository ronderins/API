    .neon-collab { animation: branchShine 2.5s ease-in-out infinite; }
  </style>
  <g class="neon-collab" fill="none" stroke="url(#neonCollabGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="8" r="3.5" />
    <circle cx="8" cy="24" r="3.5" />
    <circle cx="24" cy="14" r="3.5" />
    <line x1="8" y1="11.5" x2="8" y2="20.5" />
    <path d="M 8 18 C 14 18, 17 14, 20.5 14" />
  </g>
