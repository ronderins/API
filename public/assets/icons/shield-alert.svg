<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="neonAlertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>
  <style>
    @keyframes alertShine {
      0%, 100% { filter: drop-shadow(0 0 2px #f87171) drop-shadow(0 0 5px rgba(239, 68, 68, 0.5)); stroke-width: 1.8; }
      50% { filter: drop-shadow(0 0 5px #ef4444) drop-shadow(0 0 10px rgba(248, 113, 113, 0.9)); stroke-width: 2.1; }
    }
    .neon-s-alert { animation: alertShine 2s ease-in-out infinite; }
  </style>
  <g class="neon-s-alert" fill="none" stroke="url(#neonAlertGrad)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 16 3 C 22 5, 27 6, 27 13 C 27 21, 21 27, 16 29 C 11 27, 5 21, 5 13 C 5 6, 10 5, 16 3 Z" fill="#240707" />
    <line x1="16" y1="10" x2="16" y2="18" stroke="#fca5a5" stroke-width="2.2" />
    <circle cx="16" cy="22" r="1.3" fill="#fca5a5" />
  </g>
</svg>
