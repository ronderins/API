<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="neonZapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <style>
    @keyframes zapShine {
      0%, 100% { filter: drop-shadow(0 0 2px #f59e0b); }
      50% { filter: drop-shadow(0 0 5px #10b981); }
    }
    .neon-zap { animation: zapShine 2.4s ease-in-out infinite; }
  </style>
  <g class="neon-zap" fill="none" stroke="url(#neonZapGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="17 2 6 17 15 17 13 30 26 14 17 14" />
  </g>
</svg>
