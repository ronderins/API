<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="neonCheckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <style>
    @keyframes checkShine {
      0%, 100% { filter: drop-shadow(0 0 2px #34d399) drop-shadow(0 0 4px rgba(16, 185, 129, 0.4)); stroke-width: 1.8; }
      50% { filter: drop-shadow(0 0 4px #10b981) drop-shadow(0 0 8px rgba(52, 211, 153, 0.8)); stroke-width: 2.1; }
    }
    .neon-s-check { animation: checkShine 2.2s ease-in-out infinite; }
  </style>
  <g class="neon-s-check" fill="none" stroke="url(#neonCheckGrad)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 16 3 C 22 5, 27 6, 27 13 C 27 21, 21 27, 16 29 C 11 27, 5 21, 5 13 C 5 6, 10 5, 16 3 Z" fill="#041d16" />
    <polyline points="10 15 14 19 22 11" stroke="#34d399" stroke-width="2.2" />
  </g>
</svg>
