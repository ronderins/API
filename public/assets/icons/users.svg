<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="neonUsersGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <style>
    @keyframes usersShine {
      0%, 100% { filter: drop-shadow(0 0 2px #06b6d4); }
      50% { filter: drop-shadow(0 0 5px #10b981); }
    }
    .neon-users { animation: usersShine 2.6s ease-in-out infinite; }
  </style>
  <g class="neon-users" fill="none" stroke="url(#neonUsersGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Primary User -->
    <circle cx="12" cy="10" r="4.5" />
    <path d="M 4 25 C 4 20, 7.5 17.5, 12 17.5 C 16.5 17.5, 20 20, 20 25" />
    <!-- Secondary User (Offset) -->
    <path d="M 18 6 C 19.5 6.5, 20.5 8, 20.5 10 C 20.5 12, 19.5 13.5, 18 14" />
    <path d="M 22 18 C 24.5 19, 27 21, 27 25" />
  </g>
</svg>
