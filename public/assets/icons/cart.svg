    .neon-cart { animation: cartShine 2.5s ease-in-out infinite; }
  </style>
  <g class="neon-cart" fill="none" stroke="url(#neonCartGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="26" r="2.5" />
