<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090d" />
      <stop offset="50%" stop-color="#0f1117" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#022c22" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#27272a" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    @keyframes spinOrbital {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinOrbitalRev {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes breatheShield {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(16, 185, 129, 0.4)); }
      50% { transform: scale(1.025); filter: drop-shadow(0 0 24px rgba(52, 211, 153, 0.7)); }
    }
    @keyframes blinkLed {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px #34d399); }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px); opacity: 0.6; }
      50% { transform: translateY(-8px); opacity: 1; }
    }
    .orbital-ring {
      transform-origin: 160px 170px;
      animation: spinOrbital 24s linear infinite;
    }
    .orbital-ring-rev {
      transform-origin: 160px 170px;
      animation: spinOrbitalRev 18s linear infinite;
    }
    .shield-center {
      transform-origin: 160px 170px;
      animation: breatheShield 5s ease-in-out infinite;
    }
    .status-led {
      animation: blinkLed 2.2s ease-in-out infinite;
    }
    .particle-1 { animation: floatParticle 4s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 5.5s ease-in-out infinite 1s; }
    .particle-3 { animation: floatParticle 3.8s ease-in-out infinite 2s; }
    
    text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
    }
  </style>

  <!-- Background Base -->
  <rect width="1020" height="340" fill="url(#bgGrad)" rx="16" />
  <rect width="1020" height="340" fill="url(#cyberGrid)" rx="16" />

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="1018" height="338" fill="none" stroke="#27272a" stroke-width="1.5" rx="15" />
  <rect x="6" y="6" width="1008" height="328" fill="none" stroke="#10b981" stroke-width="0.5" stroke-opacity="0.2" rx="12" />

  <!-- Ambient Glow Behind Shield -->
  <circle cx="160" cy="170" r="115" fill="#10b981" fill-opacity="0.08" filter="url(#glow)" />
  <circle cx="160" cy="170" r="75" fill="#06b6d4" fill-opacity="0.1" filter="url(#glow)" />

  <!-- Left Side: Animated Cryptographic Shield System -->
  <g id="shield-system">
    <!-- Outer Orbital Ring -->
    <circle class="orbital-ring" cx="160" cy="170" r="110" fill="none" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="14 8 4 8" />
    <circle class="orbital-ring-rev" cx="160" cy="170" r="95" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="24 12 6 12" />

    <!-- Orbital Tracker Nodes -->
    <g class="orbital-ring">
      <circle cx="160" cy="60" r="4" fill="#34d399" filter="url(#softGlow)" />
      <circle cx="270" cy="170" r="3" fill="#38bdf8" filter="url(#softGlow)" />
      <circle cx="160" cy="280" r="3.5" fill="#10b981" />
    </g>

    <!-- Inner Shield Geometry -->
    <g class="shield-center">
      <path d="M 160 95 
               Q 198 100 216 125 
               Q 220 178 160 242 
               Q 100 178 104 125 
               Q 122 100 160 95 Z" 
            fill="url(#shieldFill)" 
            stroke="url(#emeraldGlow)" 
            stroke-width="2.8" />

      <path d="M 160 108 
               Q 189 112 203 132 
               Q 206 172 160 225 
               Q 114 172 117 132 
               Q 131 112 160 108 Z" 
            fill="none" 
            stroke="#38bdf8" 
            stroke-width="1.2" 
            stroke-opacity="0.6" 
            stroke-dasharray="5 3" />

      <!-- Center Zero-Knowledge Keyhole / Circuit Symbol -->
      <circle cx="160" cy="150" r="12" fill="none" stroke="#34d399" stroke-width="2.5" filter="url(#softGlow)" />
      <path d="M 155 160 L 151 185 L 169 185 L 165 160 Z" fill="#10b981" fill-opacity="0.85" />
      <circle cx="160" cy="150" r="5" fill="#38bdf8" />
    </g>

    <!-- Floating Hex / Particle Elements -->
    <g class="particle-1">
      <circle cx="65" cy="95" r="2.5" fill="#34d399" />
      <text x="40" y="85" class="font-mono" font-size="15" font-weight="800" fill="#34d399">0x7f4a</text>
    </g>
    <g class="particle-2">
      <circle cx="260" cy="85" r="2.5" fill="#38bdf8" />
      <text x="265" y="90" class="font-mono" font-size="15" font-weight="800" fill="#38bdf8">π=ZK</text>
    </g>
    <g class="particle-3">
      <circle cx="60" cy="245" r="2" fill="#a78bfa" />
      <text x="35" y="260" class="font-mono" font-size="15" font-weight="800" fill="#c084fc">FIPS-204</text>
    </g>
  </g>

  <!-- Divider Line (Vertical Glowing Axis) -->
  <line x1="310" y1="35" x2="310" y2="305" stroke="#27272a" stroke-width="1.2" />
  <line x1="310" y1="80" x2="310" y2="250" stroke="#10b981" stroke-width="1.8" stroke-opacity="0.4" />

  <!-- Right Side: Content & Typographic Information -->
  <g id="header-content" transform="translate(340, 0)">
    <!-- Top System State & Live Pill -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="180" height="34" rx="17" fill="#064e3b" fill-opacity="0.8" stroke="#059669" stroke-width="1.4" />
      <circle class="status-led" cx="18" cy="17" r="5.5" fill="#34d399" />
      <text x="34" y="23" class="font-mono" font-size="15" font-weight="900" fill="#a7f3d0" letter-spacing="0.5">ZERO-PII ACTIVE</text>
      
      <rect x="195" y="0" width="220" height="34" rx="17" fill="#1e1b4b" fill-opacity="0.75" stroke="#4338ca" stroke-width="1.4" />
      <text x="210" y="23" class="font-mono" font-size="15" font-weight="800" fill="#c7d2fe">RUST • 150µs LATENCY</text>

      <rect x="430" y="0" width="205" height="34" rx="17" fill="#172554" fill-opacity="0.75" stroke="#1d4ed8" stroke-width="1.4" />
      <text x="445" y="23" class="font-mono" font-size="15" font-weight="800" fill="#bae6fd">POST-QUANTUM ML-DSA</text>
    </g>

    <!-- Main Title & Branding -->
    <g transform="translate(0, 108)">
      <text x="0" y="0" font-size="46" font-weight="900" fill="#f4f4f5" letter-spacing="-1">
        AEGIS
      </text>
      <text x="165" y="-4" class="font-mono" font-size="18" font-weight="900" fill="#34d399">
        // v0.2.0 • Zero-Knowledge Engine
      </text>
      <text x="0" y="32" font-size="19" font-weight="800" fill="#ffffff">
        Privacy-Preserving Identity &amp; Predicate Verification
      </text>
      <text x="0" y="56" font-size="16" font-weight="600" fill="#cbd5e1">
        Mathematical proof of age, sanctions, and credentials with zero PII retention.
      </text>
    </g>

    <!-- Feature Matrix Pills -->
    <g transform="translate(0, 204)">
      <!-- Pill 1: Zero PII -->
      <g transform="translate(0, 0)">
        <rect width="200" height="56" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1.4" />
        <rect width="4" height="56" rx="2" fill="#10b981" />
        <text x="16" y="22" class="font-mono" font-size="14" font-weight="900" fill="#34d399">PII RETENTION</text>
        <text x="16" y="44" font-size="18" font-weight="900" fill="#ffffff">0 Bytes Stored</text>
      </g>

      <!-- Pill 2: Blake3 Merkle Ledger -->
      <g transform="translate(214, 0)">
        <rect width="200" height="56" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1.4" />
        <rect width="4" height="56" rx="2" fill="#38bdf8" />
        <text x="16" y="22" class="font-mono" font-size="14" font-weight="900" fill="#38bdf8">RECEIPT LEDGER</text>
        <text x="16" y="44" font-size="18" font-weight="900" fill="#ffffff">Blake3 Merkle</text>
      </g>

      <!-- Pill 3: Zeroize RAM -->
      <g transform="translate(428, 0)">
        <rect width="200" height="56" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1.4" />
        <rect width="4" height="56" rx="2" fill="#a78bfa" />
        <text x="16" y="22" class="font-mono" font-size="14" font-weight="900" fill="#c084fc">MEMORY FORENSICS</text>
        <text x="16" y="44" font-size="18" font-weight="900" fill="#ffffff">zeroize Scrub</text>
      </g>
    </g>

    <!-- Bottom Metadata Bar -->
    <g transform="translate(0, 288)">
      <text x="0" y="16" class="font-mono" font-size="15" font-weight="700" fill="#e2e8f0">
        CORE: <tspan fill="#34d399" font-weight="900">Rust 1.80+ (Axum)</tspan> + <tspan fill="#38bdf8" font-weight="900">Next.js 15 App Router</tspan>
      </text>
      <text x="440" y="16" class="font-mono" font-size="15" font-weight="700" fill="#e2e8f0">
        OPEN SOURCE: <tspan fill="#34d399" font-weight="900">MIT / Apache 2.0</tspan>
      </text>
    </g>
  </g>
</svg>
