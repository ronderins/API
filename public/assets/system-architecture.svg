<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="sysBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#0c1017" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="engineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0b1e36" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="ledgerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#18022e" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filters -->
    <filter id="packetGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    @keyframes pulseFlow {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes movePacket1 {
      0% { cx: 240; cy: 290; opacity: 0; }
      10% { opacity: 1; }
      40% { cx: 300; cy: 290; }
      50% { cx: 330; cy: 290; }
      90% { opacity: 1; }
      100% { cx: 520; cy: 290; opacity: 0; }
    }
    @keyframes movePacket2 {
      0% { cx: 520; cy: 290; opacity: 0; }
      15% { opacity: 1; }
      50% { cx: 700; cy: 290; }
      85% { opacity: 1; }
      100% { cx: 830; cy: 230; opacity: 0; }
    }
    @keyframes movePacketLedger {
      0% { cx: 700; cy: 330; opacity: 0; }
      15% { opacity: 1; }
      60% { cx: 780; cy: 450; }
      85% { opacity: 1; }
      100% { cx: 840; cy: 460; opacity: 0; }
    }
    @keyframes zeroizePulse {
      0%, 100% { fill-opacity: 0.2; stroke-opacity: 0.6; }
      50% { fill-opacity: 0.45; stroke-opacity: 1; }
    }
    @keyframes beaconBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }

    .flow-line {
      stroke-dasharray: 8 6;
      animation: pulseFlow 2.8s linear infinite;
    }
    .zeroize-badge {
      animation: zeroizePulse 3s ease-in-out infinite;
    }
    .beacon {
      transform-origin: center;
      animation: beaconBlink 2s ease-in-out infinite;
    }

    text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
    }
  </style>

  <!-- Background Base -->
  <rect width="1080" height="620" fill="url(#sysBgGrad)" rx="16" />
  <rect x="1" y="1" width="1078" height="618" fill="none" stroke="#27272a" stroke-width="1.5" rx="15" />

  <!-- Top Title Banner -->
  <g transform="translate(40, 42)">
    <text x="0" y="0" font-size="24" font-weight="800" fill="#f4f4f5" letter-spacing="-0.5">
      Aegis Architectural System Design
    </text>
    <text x="420" y="-1" class="font-mono" font-size="13" font-weight="600" fill="#10b981">
      // END-TO-END ZERO-PII CRYPTOGRAPHIC PIPELINE
    </text>
    <text x="0" y="24" font-size="14" fill="#94a3b8">
      How cryptographic commitments, ephemeral witness evaluation, and Merkle ledgers prevent PII retention.
    </text>
  </g>

  <!-- Animated Signal Flow Lines Connecting Tiers -->
  <path d="M 260 300 L 305 300" fill="none" stroke="#10b981" stroke-width="3" class="flow-line" />
  <path d="M 525 300 L 570 300" fill="none" stroke="#38bdf8" stroke-width="3" class="flow-line" />
  <path d="M 800 240 L 845 220" fill="none" stroke="#34d399" stroke-width="3" class="flow-line" />
  <path d="M 800 360 L 845 420" fill="none" stroke="#a78bfa" stroke-width="3" class="flow-line" />

  <!-- Moving Data Packets -->
  <circle cx="260" cy="300" r="5" fill="#34d399" filter="url(#packetGlow)" style="animation: movePacket1 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;" />
  <circle cx="525" cy="300" r="5" fill="#38bdf8" filter="url(#packetGlow)" style="animation: movePacket2 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite 1.2s;" />
  <circle cx="800" cy="360" r="5" fill="#c084fc" filter="url(#packetGlow)" style="animation: movePacketLedger 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite 2.1s;" />

  <!-- ================= TIER 1: CLIENT / SUBJECT EDGE ================= -->
  <g id="tier-1" transform="translate(35, 95)">
    <!-- Column Card Frame -->
    <rect width="225" height="470" rx="14" fill="url(#clientGrad)" stroke="#059669" stroke-width="1.5" stroke-opacity="0.5" filter="url(#cardShadow)" />
    
    <!-- Header -->
    <rect x="0" y="0" width="225" height="48" rx="14" fill="#064e3b" fill-opacity="0.5" />
    <path d="M 0 36 L 225 36" stroke="#059669" stroke-width="1" stroke-opacity="0.4" />
    <circle class="beacon" cx="22" cy="24" r="5" fill="#34d399" />
    <text x="38" y="28" class="font-mono" font-size="13" font-weight="700" fill="#a7f3d0">1. CLIENT EDGE</text>

    <!-- Subtitle -->
    <text x="16" y="66" font-size="12" font-weight="700" fill="#6ee7b7">Device-Side Execution</text>
    <text x="16" y="82" font-size="11" fill="#cbd5e1">Browser / Mobile App / SDK</text>

    <!-- Step 1A: Raw Document Input -->
    <g transform="translate(14, 96)">
      <rect width="197" height="88" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="12" y="22" font-size="13" font-weight="700" fill="#f4f4f5">ID Card / Passport</text>
      <text x="12" y="40" class="font-mono" font-size="11.5" fill="#94a3b8">Birth: 2001-08-14 (MRZ)</text>
      <!-- Red PII Drop Box -->
      <rect x="10" y="50" width="177" height="28" rx="5" fill="#450a0a" fill-opacity="0.7" stroke="#dc2626" stroke-width="1" />
      <text x="16" y="69" class="font-mono" font-size="10.5" font-weight="700" fill="#fecaca">PII NEVER LEAVES DEVICE</text>
    </g>

    <!-- Step 1B: WebCrypto Hashing -->
    <g transform="translate(14, 196)">
      <rect width="197" height="110" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="12" y="22" font-size="13" font-weight="700" fill="#34d399">One-Way Blake3 Hash</text>
      <text x="12" y="40" class="font-mono" font-size="11" fill="#a1a1aa">H(doc) = 0x8f3c4e...</text>
      
      <!-- Salt / Nonce -->
      <rect x="10" y="52" width="177" height="46" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="70" class="font-mono" font-size="11" font-weight="600" fill="#38bdf8">+ Blinding Nonce (r)</text>
      <text x="14" y="86" class="font-mono" font-size="10" fill="#94a3b8">Prevents tracking across sites</text>
    </g>

    <!-- Transmit Payload -->
    <g transform="translate(14, 318)">
      <rect width="197" height="136" rx="8" fill="#064e3b" fill-opacity="0.3" stroke="#10b981" stroke-width="1.2" />
      <text x="12" y="22" class="font-mono" font-size="11.5" font-weight="700" fill="#34d399">EMITTED PAYLOAD:</text>
      <text x="12" y="44" class="font-mono" font-size="11" fill="#e2e8f0">• doc_hash (64 hex)</text>
      <text x="12" y="64" class="font-mono" font-size="11" fill="#e2e8f0">• user_digest (hash)</text>
      <text x="12" y="84" class="font-mono" font-size="11" fill="#e2e8f0">• threshold: 21</text>
      <text x="12" y="104" class="font-mono" font-size="11" fill="#e2e8f0">• session_nonce</text>
      <rect x="10" y="116" width="177" height="10" rx="3" fill="#10b981" fill-opacity="0.4" />
    </g>
  </g>

  <!-- ================= TIER 2: API GATEWAY & SESSION GUARD ================= -->
  <g id="tier-2" transform="translate(295, 95)">
    <!-- Column Card Frame -->
    <rect width="230" height="470" rx="14" fill="url(#gatewayGrad)" stroke="#4338ca" stroke-width="1.5" stroke-opacity="0.5" filter="url(#cardShadow)" />

    <!-- Header -->
    <rect x="0" y="0" width="230" height="48" rx="14" fill="#1e1b4b" fill-opacity="0.6" />
    <path d="M 0 36 L 230 36" stroke="#4338ca" stroke-width="1" stroke-opacity="0.4" />
    <circle class="beacon" cx="22" cy="24" r="5" fill="#818cf8" />
    <text x="38" y="28" class="font-mono" font-size="13" font-weight="700" fill="#e0e7ff">2. API GATEWAY</text>

    <!-- Subtitle -->
    <text x="16" y="66" font-size="12" font-weight="700" fill="#a5b4fc">Transport &amp; Guard</text>
    <text x="16" y="82" font-size="11" fill="#cbd5e1">Axum Route Handlers</text>

    <!-- Single Use Challenge Nonce -->
    <g transform="translate(14, 96)">
      <rect width="202" height="96" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="12" y="24" font-size="13" font-weight="700" fill="#818cf8">GET /api/v1/session</text>
      <text x="12" y="44" font-size="11" fill="#cbd5e1">Cryptographic Challenge Nonce</text>
      <text x="12" y="64" class="font-mono" font-size="11" font-weight="600" fill="#a5b4fc">TTL: 300s (5 minutes)</text>
      <text x="12" y="82" class="font-mono" font-size="10.5" fill="#94a3b8">Defeats replay attacks</text>
    </g>

    <!-- Replay Guard & Timing Shield -->
    <g transform="translate(14, 204)">
      <rect width="202" height="110" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="12" y="24" font-size="13" font-weight="700" fill="#c084fc">Timing Shield &amp; Sandbox</text>
      <text x="12" y="44" class="font-mono" font-size="11" fill="#e9d5ff">constant_time::verify()</text>
      <text x="12" y="62" font-size="11" fill="#94a3b8">Prevents side-channel leaks</text>
      <text x="12" y="82" class="font-mono" font-size="11" fill="#a855f7">seccomp_sandbox::apply()</text>
      <text x="12" y="98" font-size="10.5" fill="#94a3b8">Linux syscall filter locked</text>
    </g>

    <!-- Dispatch to Rust Core -->
    <g transform="translate(14, 326)">
      <rect width="202" height="128" rx="8" fill="#1e1b4b" fill-opacity="0.35" stroke="#6366f1" stroke-width="1.2" />
      <text x="12" y="24" class="font-mono" font-size="11.5" font-weight="700" fill="#a5b4fc">SECURITY ENFORCEMENT:</text>
      <text x="12" y="48" class="font-mono" font-size="11" fill="#e0e7ff">✓ Rate Limit (Token Bucket)</text>
      <text x="12" y="68" class="font-mono" font-size="11" fill="#e0e7ff">✓ Pre-shared X-API-Key</text>
      <text x="12" y="88" class="font-mono" font-size="11" fill="#e0e7ff">✓ Strict CSP Security Headers</text>
      <text x="12" y="110" class="font-mono" font-size="11" font-weight="700" fill="#a7f3d0">→ Dispatched to ZK Engine</text>
    </g>
  </g>

  <!-- ================= TIER 3: AEGIS CORE ENGINE ================= -->
  <g id="tier-3" transform="translate(560, 95)">
    <!-- Column Card Frame -->
    <rect width="240" height="470" rx="14" fill="url(#engineGrad)" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.6" filter="url(#cardShadow)" />

    <!-- Header -->
    <rect x="0" y="0" width="240" height="48" rx="14" fill="#0c4a6e" fill-opacity="0.5" />
    <path d="M 0 36 L 240 36" stroke="#0284c7" stroke-width="1" stroke-opacity="0.4" />
    <circle class="beacon" cx="22" cy="24" r="5" fill="#38bdf8" />
    <text x="38" y="28" class="font-mono" font-size="13" font-weight="700" fill="#bae6fd">3. AEGIS RUST CORE</text>

    <!-- Subtitle -->
    <text x="16" y="66" font-size="12" font-weight="700" fill="#38bdf8">ZK Circuits &amp; Attestation</text>
    <text x="16" y="82" font-size="11" fill="#cbd5e1">Native Rust • Sub-Millisecond</text>

    <!-- Circuit Evaluation Box -->
    <g transform="translate(14, 96)">
      <rect width="212" height="124" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="12" y="24" font-size="13" font-weight="700" fill="#38bdf8">Predicate Circuit Evaluator</text>
      <text x="12" y="44" class="font-mono" font-size="11" fill="#cbd5e1">• Groth16 (BN254 curve)</text>
      <text x="12" y="62" class="font-mono" font-size="11" fill="#cbd5e1">• Bulletproofs Range Bounds</text>
      <text x="12" y="80" class="font-mono" font-size="11" fill="#cbd5e1">• Sanctions Non-Membership</text>
      
      <rect x="10" y="90" width="192" height="26" rx="5" fill="#0369a1" fill-opacity="0.35" stroke="#0284c7" stroke-width="1" />
      <text x="16" y="108" class="font-mono" font-size="11" font-weight="700" fill="#7dd3fc">Constraint: (Age ≥ 21) = 1</text>
    </g>

    <!-- CRITICAL: Zeroize Memory Scrubbing -->
    <g transform="translate(14, 232)">
      <rect class="zeroize-badge" width="212" height="102" rx="8" fill="#15803d" stroke="#22c55e" stroke-width="1.5" />
      <text x="12" y="24" font-size="13" font-weight="800" fill="#dcfce7">⚡ ZEROIZE MEMORY SCRUB</text>
      <text x="12" y="44" class="font-mono" font-size="11" fill="#bbf7d0">Heap &amp; stack witness erased</text>
      <text x="12" y="64" class="font-mono" font-size="11" font-weight="600" fill="#86efac">zeroize::Zeroize::zeroize(&amp;mut w)</text>
      <text x="12" y="86" font-size="11" fill="#f0fdf4">Zero trace left in RAM for forensics</text>
    </g>

    <!-- Post-Quantum Hybrid Attestation -->
    <g transform="translate(14, 346)">
      <rect width="212" height="108" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="24" font-size="13" font-weight="700" fill="#a78bfa">Post-Quantum Attestation</text>
      <text x="12" y="44" class="font-mono" font-size="11" fill="#c4b5fd">ML-DSA (FIPS 204) + Ed25519</text>
      <text x="12" y="64" class="font-mono" font-size="11" fill="#94a3b8">Dual cryptographic commitment</text>
      <text x="12" y="88" class="font-mono" font-size="11.5" font-weight="800" fill="#34d399">EXECUTION TIME: &lt;150 µs</text>
    </g>
  </g>

  <!-- ================= TIER 4: OUTPUT & AUDIT LEDGER ================= -->
  <g id="tier-4" transform="translate(835, 95)">
    <!-- Top Card: Verifier Output -->
    <g transform="translate(0, 0)">
      <rect width="210" height="225" rx="14" fill="url(#clientGrad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5" filter="url(#cardShadow)" />
      
      <rect x="0" y="0" width="210" height="44" rx="14" fill="#064e3b" fill-opacity="0.6" />
      <circle class="beacon" cx="20" cy="22" r="5" fill="#34d399" />
      <text x="36" y="26" class="font-mono" font-size="12" font-weight="700" fill="#a7f3d0">4A. VERIFIER TOKEN</text>

      <g transform="translate(14, 56)">
        <text x="0" y="14" font-size="12" font-weight="700" fill="#34d399">Signed JWT Token</text>
        <rect x="0" y="24" width="182" height="74" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <text x="10" y="44" class="font-mono" font-size="11" font-weight="600" fill="#e2e8f0">status: "verified"</text>
        <text x="10" y="62" class="font-mono" font-size="11" fill="#e2e8f0">criteria: "age_over_21"</text>
        <text x="10" y="80" class="font-mono" font-size="11" font-weight="700" fill="#10b981">pii_stored: 0</text>

        <rect x="0" y="106" width="182" height="52" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="10" y="126" class="font-mono" font-size="10.5" fill="#38bdf8">Third-party verifier checks</text>
        <text x="10" y="144" class="font-mono" font-size="10.5" font-weight="600" fill="#94a3b8">via POST /api/v1/verify-token</text>
      </g>
    </g>

    <!-- Bottom Card: Merkle Block Ledger -->
    <g transform="translate(0, 240)">
      <rect width="210" height="230" rx="14" fill="url(#ledgerGrad)" stroke="#9333ea" stroke-width="1.5" stroke-opacity="0.5" filter="url(#cardShadow)" />
      
      <rect x="0" y="0" width="210" height="44" rx="14" fill="#581c87" fill-opacity="0.6" />
      <circle class="beacon" cx="20" cy="22" r="5" fill="#c084fc" />
      <text x="36" y="26" class="font-mono" font-size="12" font-weight="700" fill="#f3e8ff">4B. MERKLE LEDGER</text>

      <g transform="translate(14, 56)">
        <text x="0" y="14" font-size="12" font-weight="700" fill="#c084fc">Blake3 Merkle Chain</text>
        <rect x="0" y="24" width="182" height="74" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <text x="10" y="44" class="font-mono" font-size="11" fill="#cbd5e1">Block Hash Receipt</text>
        <text x="10" y="62" class="font-mono" font-size="10.5" fill="#a78bfa">Root: 0x9e12bf8a...</text>
        <text x="10" y="80" class="font-mono" font-size="11" font-weight="700" fill="#34d399">Inclusion: O(log N) Proof</text>

        <rect x="0" y="106" width="182" height="56" rx="6" fill="#2e1065" fill-opacity="0.45" stroke="#6b21a8" stroke-width="1" />
        <text x="10" y="126" class="font-mono" font-size="10.5" font-weight="700" fill="#d8b4fe">POST /api/v1/verify-merkle</text>
        <text x="10" y="144" class="font-mono" font-size="10.5" fill="#cbd5e1">Auditable tamper evidence</text>
      </g>
    </g>
  </g>

  <!-- Bottom Global Trust Footer -->
  <g transform="translate(40, 584)">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#27272a" stroke-width="1.2" />
    <text x="0" y="22" class="font-mono" font-size="12" fill="#94a3b8">
      CRYPTOGRAPHIC INTEGRITY: <tspan fill="#34d399" font-weight="700">0 Bytes PII Stored</tspan> • <tspan fill="#38bdf8" font-weight="700">Blake3 SIMD Hash Chains</tspan> • <tspan fill="#a78bfa" font-weight="700">FIPS 204 Lattice ML-DSA</tspan> • <tspan fill="#f59e0b" font-weight="700">eIDAS 2.0 / ISO 18013-5 mDL Ready</tspan>
    </text>
  </g>
</svg>
