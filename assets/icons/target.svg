<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" style="background: transparent;">
  <defs>
    <linearGradient id="themeTargetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ee2d6" />
      <stop offset="100%" stop-color="#73C7B8" />
    </linearGradient>
  </defs>
  <style>
    @keyframes targetPulse {
      0%, 100% { stroke-opacity: 0.82; }
      50% { stroke-opacity: 1; }
    }
    .theme-target { animation: targetPulse 2.5s ease-in-out infinite; }
  </style>
  <g class="theme-target" fill="none" stroke="url(#themeTargetGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="16" r="12" />
    <circle cx="16" cy="16" r="7" />
    <circle cx="16" cy="16" r="2" />
  </g>
</svg>
