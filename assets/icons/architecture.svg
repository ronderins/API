<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" style="background: transparent;">
  <defs>
    <linearGradient id="themeArchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ee2d6" />
      <stop offset="100%" stop-color="#73C7B8" />
    </linearGradient>
  </defs>
  <style>
    @keyframes archPulse {
      0%, 100% { stroke-opacity: 0.82; }
      50% { stroke-opacity: 1; }
    }
    .theme-arch { animation: archPulse 2.5s ease-in-out infinite; }
  </style>
  <g class="theme-arch" fill="none" stroke="url(#themeArchGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="16 3 28 9 16 15 4 9 16 3" />
    <polyline points="4 15 16 21 28 15" />
    <polyline points="4 21 16 27 28 21" />
  </g>
</svg>
