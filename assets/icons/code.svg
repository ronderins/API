<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" style="background: transparent;">
  <defs>
    <linearGradient id="themeCodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ee2d6" />
      <stop offset="100%" stop-color="#73C7B8" />
    </linearGradient>
  </defs>
  <style>
    @keyframes codePulse {
      0%, 100% { stroke-opacity: 0.82; }
      50% { stroke-opacity: 1; }
    }
    .theme-code { animation: codePulse 2.5s ease-in-out infinite; }
  </style>
  <g class="theme-code" fill="none" stroke="url(#themeCodeGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="10 8 2 16 10 24" />
    <polyline points="22 8 30 16 22 24" />
    <line x1="19" y1="5" x2="13" y2="27" />
  </g>
</svg>
