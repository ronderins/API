<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="neonKeyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <style>
    @keyframes keyGlow {
      0%, 100% { filter: drop-shadow(0 0 2px #fbbf24) drop-shadow(0 0 5px rgba(245, 158, 11, 0.5)); stroke-width: 1.8; }
      50% { filter: drop-shadow(0 0 4px #10b981) drop-shadow(0 0 9px rgba(251, 191, 36, 0.8)); stroke-width: 2.1; }
    }
    .neon-key { animation: keyGlow 2.6s ease-in-out infinite; }
  </style>
  <g class="neon-key" fill="none" stroke="url(#neonKeyGrad)" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="13" r="7" fill="#140f06" />
    <circle cx="11" cy="13" r="2.5" />
    <path d="M 16 18 L 27 29" />
    <path d="M 23 25 L 26 22" />
    <path d="M 20 28 L 23 25" />
  </g>
</svg>
