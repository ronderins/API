<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" style="background: transparent;">
  <defs>
    <linearGradient id="themeKeyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ee2d6" />
      <stop offset="100%" stop-color="#73C7B8" />
    </linearGradient>
  </defs>
  <style>
    @keyframes keyPulse {
      0%, 100% { stroke-opacity: 0.82; }
      50% { stroke-opacity: 1; }
    }
    .theme-key { animation: keyPulse 2.5s ease-in-out infinite; }
  </style>
  <g class="theme-key" fill="none" stroke="url(#themeKeyGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="16" r="6" />
    <circle cx="10" cy="16" r="2.5" />
    <path d="M 16 16 L 28 16 L 28 20" />
    <path d="M 23 16 L 23 19" />
  </g>
</svg>
