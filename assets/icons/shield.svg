<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" style="background: transparent;">
  <defs>
    <linearGradient id="themeShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ee2d6" />
      <stop offset="100%" stop-color="#73C7B8" />
    </linearGradient>
  </defs>
  <style>
    @keyframes shieldPulse {
      0%, 100% { stroke-opacity: 0.82; }
      50% { stroke-opacity: 1; }
    }
    .theme-shield { animation: shieldPulse 2.5s ease-in-out infinite; }
  </style>
  <g class="theme-shield" fill="none" stroke="url(#themeShieldGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 16 3 L 27 7 V 15 C 27 22 22 27 16 29 C 10 27 5 22 5 15 V 7 Z" />
  </g>
</svg>
