<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" style="background: transparent;">
  <defs>
    <linearGradient id="themeCircuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ee2d6" />
      <stop offset="100%" stop-color="#73C7B8" />
    </linearGradient>
  </defs>
  <style>
    @keyframes circuitPulse {
      0%, 100% { stroke-opacity: 0.82; }
      50% { stroke-opacity: 1; }
    }
    .theme-circuit { animation: circuitPulse 2.5s ease-in-out infinite; }
  </style>
  <g class="theme-circuit" fill="none" stroke="url(#themeCircuitGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="8" width="16" height="16" rx="3" />
    <circle cx="16" cy="16" r="3" />
    <line x1="8" y1="12" x2="3" y2="12" />
    <line x1="8" y1="20" x2="3" y2="20" />
    <line x1="24" y1="12" x2="29" y2="12" />
    <line x1="24" y1="20" x2="29" y2="20" />
    <line x1="12" y1="8" x2="12" y2="3" />
    <line x1="20" y1="8" x2="20" y2="3" />
    <line x1="12" y1="24" x2="12" y2="29" />
    <line x1="20" y1="24" x2="20" y2="29" />
  </g>
</svg>
