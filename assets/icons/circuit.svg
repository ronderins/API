<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="neonCircuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <style>
    @keyframes circuitGlow {
      0%, 100% { filter: drop-shadow(0 0 2px #10b981) drop-shadow(0 0 5px rgba(52, 211, 153, 0.5)); }
      50% { filter: drop-shadow(0 0 4px #34d399) drop-shadow(0 0 9px rgba(6, 182, 212, 0.9)); }
    }
    @keyframes pinBlink {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .neon-chip { animation: circuitGlow 2.4s ease-in-out infinite; }
    .pin-pulse { animation: pinBlink 1.5s ease-in-out infinite alternate; }
  </style>
  <g class="neon-chip" fill="none" stroke="url(#neonCircuitGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center Node Ring -->
    <circle cx="16" cy="16" r="4.5" fill="none" stroke="#34d399" stroke-width="2.2" />
    <circle cx="16" cy="16" r="1.5" fill="none" stroke="#06b6d4" stroke-width="1.8" />
    
    <!-- Circuit Traces with Terminal Nodes -->
    <path d="M 4 8 L 10 8 L 13 13" class="pin-pulse" />
    <circle cx="4" cy="8" r="1.5" stroke="#34d399" />

    <path d="M 4 24 L 10 24 L 13 19" />
    <circle cx="4" cy="24" r="1.5" stroke="#10b981" />

    <path d="M 28 8 L 22 8 L 19 13" />
    <circle cx="28" cy="8" r="1.5" stroke="#06b6d4" />

    <path d="M 28 24 L 22 24 L 19 19" class="pin-pulse" />
    <circle cx="28" cy="24" r="1.5" stroke="#34d399" />

    <line x1="16" y1="3" x2="16" y2="10" class="pin-pulse" />
    <circle cx="16" cy="3" r="1.5" stroke="#34d399" />

    <line x1="16" y1="22" x2="16" y2="29" class="pin-pulse" />
    <circle cx="16" cy="29" r="1.5" stroke="#06b6d4" />
  </g>
</svg>
