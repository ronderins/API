<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="neonCircuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <style>
    @keyframes circuitGlow {
      0%, 100% { filter: drop-shadow(0 0 2px #10b981) drop-shadow(0 0 5px rgba(52, 211, 153, 0.5)); }
      50% { filter: drop-shadow(0 0 4px #34d399) drop-shadow(0 0 9px rgba(6, 182, 212, 0.9)); }
    }
    @keyframes pinBlink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    .neon-chip { animation: circuitGlow 2.4s ease-in-out infinite; }
    .pin-pulse { animation: pinBlink 1.5s ease-in-out infinite alternate; }
  </style>
  <g class="neon-chip" fill="none" stroke="url(#neonCircuitGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center IC Chip -->
    <rect x="9" y="9" width="14" height="14" rx="2.5" fill="#061f18" />
    <circle cx="16" cy="16" r="2.5" fill="#34d399" />
    <!-- Pin Leads -->
    <line x1="4" y1="12" x2="9" y2="12" class="pin-pulse" />
    <line x1="4" y1="16" x2="9" y2="16" />
    <line x1="4" y1="20" x2="9" y2="20" class="pin-pulse" />
    
    <line x1="23" y1="12" x2="28" y2="12" class="pin-pulse" />
    <line x1="23" y1="16" x2="28" y2="16" />
    <line x1="23" y1="20" x2="28" y2="20" class="pin-pulse" />
    
    <line x1="12" y1="4" x2="12" y2="9" />
    <line x1="16" y1="4" x2="16" y2="9" class="pin-pulse" />
    <line x1="20" y1="4" x2="20" y2="9" />

    <line x1="12" y1="23" x2="12" y2="28" />
    <line x1="16" y1="23" x2="16" y2="28" class="pin-pulse" />
    <line x1="20" y1="23" x2="20" y2="28" />
  </g>
</svg>
