<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="neonCircuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>
  <style>
    @keyframes circuitShine {
      0%, 100% { filter: drop-shadow(0 0 2px #10b981); }
      50% { filter: drop-shadow(0 0 5px #34d399); }
    }
    .neon-circuit { animation: circuitShine 2.5s ease-in-out infinite; }
  </style>
  <g class="neon-circuit" fill="none" stroke="url(#neonCircuitGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="7" y="7" width="18" height="18" rx="3" />
    <path d="M 12 12 L 20 12 L 20 20 L 12 20 Z" />
    <!-- External Pins -->
    <line x1="12" y1="2" x2="12" y2="7" />
    <line x1="20" y1="2" x2="20" y2="7" />
    <line x1="12" y1="25" x2="12" y2="30" />
    <line x1="20" y1="25" x2="20" y2="30" />
    <line x1="2" y1="12" x2="7" y2="12" />
    <line x1="2" y1="20" x2="7" y2="20" />
    <line x1="25" y1="12" x2="30" y2="12" />
    <line x1="25" y1="20" x2="30" y2="20" />
  </g>
</svg>
