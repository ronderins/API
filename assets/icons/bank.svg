  </style>
  <g class="theme-bank" fill="none" stroke="url(#themeBankGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 3 10 L 16 3 L 29 10 Z" />
    <line x1="6" y1="10" x2="6" y2="24" />
