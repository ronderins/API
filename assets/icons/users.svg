<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="neonUsersGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <style>
    @keyframes usersShimmer {
      0%, 100% { filter: drop-shadow(0 0 2px #06b6d4) drop-shadow(0 0 5px rgba(16, 185, 129, 0.5)); stroke-width: 1.8; }
      50% { filter: drop-shadow(0 0 5px #10b981) drop-shadow(0 0 10px rgba(6, 182, 212, 0.8)); stroke-width: 2.1; }
    }
    .neon-users { animation: usersShimmer 2.8s ease-in-out infinite; }
  </style>
  <g class="neon-users" fill="none" stroke="url(#neonUsersGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center User -->
    <circle cx="16" cy="11" r="5" />
    <path d="M 8 27 C 8 22, 11 19, 16 19 C 21 19, 24 22, 24 27" />
    <!-- Secondary User Left/Back -->
    <path d="M 9 9 A 3.5 3.5 0 0 1 5 13" stroke-opacity="0.6" stroke-dasharray="3 2" />
    <path d="M 4 25 C 4 21.5, 6 18.5, 9.5 17.5" stroke-opacity="0.6" stroke-dasharray="3 2" />
    <!-- Secondary User Right/Back -->
    <path d="M 23 9 A 3.5 3.5 0 0 0 27 13" stroke-opacity="0.6" stroke-dasharray="3 2" />
    <path d="M 28 25 C 28 21.5, 26 18.5, 22.5 17.5" stroke-opacity="0.6" stroke-dasharray="3 2" />
  </g>
</svg>
