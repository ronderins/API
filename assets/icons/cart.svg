<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" style="background: transparent;">
  <defs>
    <linearGradient id="themeCartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ee2d6" />
      <stop offset="100%" stop-color="#73C7B8" />
    </linearGradient>
  </defs>
  <style>
    @keyframes cartPulse {
      0%, 100% { stroke-opacity: 0.82; }
      50% { stroke-opacity: 1; }
    }
    .theme-cart { animation: cartPulse 2.5s ease-in-out infinite; }
  </style>
  <g class="theme-cart" fill="none" stroke="url(#themeCartGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="26" r="2.5" />
    <circle cx="23" cy="26" r="2.5" />
    <path d="M 3 5 L 7 5 L 11 20 L 25 20 L 28 9 L 8 9" />
  </g>
</svg>
