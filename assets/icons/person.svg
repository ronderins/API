<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" style="background: transparent;">
  <defs>
    <linearGradient id="themePersonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ee2d6" />
      <stop offset="100%" stop-color="#73C7B8" />
    </linearGradient>
  </defs>
  <style>
    @keyframes personPulse {
      0%, 100% { stroke-opacity: 0.82; }
      50% { stroke-opacity: 1; }
    }
    .theme-person { animation: personPulse 2.5s ease-in-out infinite; }
  </style>
  <g class="theme-person" fill="none" stroke="url(#themePersonGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="9" r="5" />
    <path d="M 6 26 C 6 20, 10 17, 16 17 C 22 17, 26 20, 26 26" />
  </g>
</svg>
