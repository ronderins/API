<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" style="background: transparent;">
  <defs>
    <linearGradient id="themeTermGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ee2d6" />
      <stop offset="100%" stop-color="#73C7B8" />
    </linearGradient>
  </defs>
  <style>
    @keyframes termPulse {
      0%, 100% { stroke-opacity: 0.82; }
      50% { stroke-opacity: 1; }
    }
    .theme-term { animation: termPulse 2.5s ease-in-out infinite; }
  </style>
  <g class="theme-term" fill="none" stroke="url(#themeTermGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5" width="26" height="22" rx="4" stroke-width="1.8" />
    <polyline points="8 12 13 16 8 20" />
    <line x1="16" y1="20" x2="23" y2="20" />
  </g>
</svg>
