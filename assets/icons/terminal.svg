<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="neonTermGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>
  <style>
    @keyframes termShine {
      0%, 100% { filter: drop-shadow(0 0 2px #06b6d4); }
      50% { filter: drop-shadow(0 0 5px #34d399); }
    }
    .neon-term { animation: termShine 2.5s ease-in-out infinite; }
  </style>
  <g class="neon-term" fill="none" stroke="url(#neonTermGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="5 8 13 16 5 24" />
    <line x1="16" y1="24" x2="27" y2="24" stroke="#34d399" />
  </g>
</svg>
