<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="neonDocGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>
  <style>
    @keyframes docPulse {
      0%, 100% { filter: drop-shadow(0 0 2px #38bdf8) drop-shadow(0 0 5px rgba(96, 165, 250, 0.5)); stroke-width: 2.2; }
      50% { filter: drop-shadow(0 0 4px #60a5fa) drop-shadow(0 0 9px rgba(56, 189, 248, 0.8)); stroke-width: 2.5; }
    }
    .neon-doc { animation: docPulse 2.8s ease-in-out infinite; }
  </style>
  <g class="neon-doc" fill="none" stroke="url(#neonDocGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Balance Scales of Justice (Legal / MIT License) -->
    <!-- Pillar -->
    <line x1="16" y1="5" x2="16" y2="28" stroke-width="2.4" />
    <line x1="10" y1="28" x2="22" y2="28" stroke-width="2.4" />
    <circle cx="16" cy="5" r="2" stroke-width="2" />
    <!-- Cross Beam -->
    <line x1="6" y1="10" x2="26" y2="10" stroke-width="2.2" />
    <!-- Left Pan -->
    <line x1="6" y1="10" x2="3" y2="17" stroke-width="1.6" />
    <line x1="6" y1="10" x2="9" y2="17" stroke-width="1.6" />
    <path d="M 2 17 Q 6 21 10 17 Z" stroke-width="1.8" />
    <!-- Right Pan -->
    <line x1="26" y1="10" x2="23" y2="17" stroke-width="1.6" />
    <line x1="26" y1="10" x2="29" y2="17" stroke-width="1.6" />
    <path d="M 22 17 Q 26 21 30 17 Z" stroke-width="1.8" />
  </g>
</svg>
