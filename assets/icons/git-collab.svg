<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="neonCollabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <style>
    @keyframes heartBeacon {
      0%, 100% { filter: drop-shadow(0 0 2px #f43f5e) drop-shadow(0 0 5px rgba(236, 72, 153, 0.6)); stroke-width: 1.8; }
      50% { filter: drop-shadow(0 0 5px #8b5cf6) drop-shadow(0 0 11px rgba(244, 63, 94, 0.9)); stroke-width: 2.2; }
    }
    @keyframes nodeBlink {
      0%, 100% { fill: #f43f5e; }
      50% { fill: #8b5cf6; }
    }
    .neon-collab { animation: heartBeacon 2.4s ease-in-out infinite; }
    .collab-dot { animation: nodeBlink 2.4s ease-in-out infinite; }
  </style>
  <g class="neon-collab" fill="none" stroke="url(#neonCollabGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Git Branch / Pull Request lines -->
    <circle cx="8" cy="8" r="3" class="collab-dot" />
    <circle cx="8" cy="24" r="3" />
    <circle cx="24" cy="14" r="3" class="collab-dot" />
    <line x1="8" y1="11" x2="8" y2="21" />
    <path d="M 8 18 C 14 18, 18 14, 21 14" stroke-dasharray="3 2" />
    <!-- Heart in background -->
    <path d="M 21 21 C 18 19, 15 21, 15 23 C 15 26, 21 29, 21 29 C 21 29, 27 26, 27 23 C 27 21, 24 19, 21 21 Z" stroke="#ec4899" stroke-width="1.2" />
  </g>
</svg>
