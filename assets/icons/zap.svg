<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" style="background: transparent;">
  <defs>
    <linearGradient id="themeZapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ee2d6" />
      <stop offset="100%" stop-color="#73C7B8" />
    </linearGradient>
  </defs>
  <style>
    @keyframes zapPulse {
      0%, 100% { stroke-opacity: 0.82; }
      50% { stroke-opacity: 1; }
    }
    .theme-zap { animation: zapPulse 2.5s ease-in-out infinite; }
  </style>
  <g class="theme-zap" fill="none" stroke="url(#themeZapGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="17 2 5 18 15 18 13 30 27 14 17 14 17 2" />
  </g>
</svg>
