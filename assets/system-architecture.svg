<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="sysBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f" />
      <stop offset="50%" stop-color="#0f1219" />
      <stop offset="100%" stop-color="#08090d" />
    </linearGradient>

    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="engineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="ledgerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#2e1065" stop-opacity="0.25" />
    </linearGradient>

    <!-- Filters -->
    <filter id="packetGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Arrow Markers for Architecture Data Flow -->
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrowSky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a78bfa" />
    </marker>
  </defs>

  <style>
    @keyframes beaconBlink {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px #34d399); }
    }
    @keyframes zeroizeFlash {
      0%, 100% { stroke: #22c55e; stroke-width: 1.5; }
      50% { stroke: #4ade80; stroke-width: 3; filter: drop-shadow(0 0 8px #22c55e); }
    }
    .flow-line {
      stroke-dasharray: 6 4;
    }
    .beacon {
      animation: beaconBlink 2.5s ease-in-out infinite;
    }
    .zeroize-badge {
      animation: zeroizeFlash 3s ease-in-out infinite;
    }
    text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
    }
  </style>

  <!-- Background Base -->
  <rect width="1080" height="620" fill="url(#sysBgGrad)" rx="16" />
  <rect x="1" y="1" width="1078" height="618" fill="none" stroke="#27272a" stroke-width="1.5" rx="15" />

  <!-- Top Title Banner -->
  <g transform="translate(40, 46)">
    <text x="0" y="0" font-size="32" font-weight="900" fill="#f4f4f5" letter-spacing="-0.5">
      Aegis Architectural System Design
    </text>
    <text x="560" y="-1" class="font-mono" font-size="17" font-weight="800" fill="#34d399">
      // ZERO-PII CRYPTO PIPELINE
    </text>
    <text x="0" y="28" font-size="17" font-weight="600" fill="#94a3b8">
      Sub-millisecond Rust attestation, memory zeroization, and append-only Merkle ledger.
    </text>
  </g>

  <!-- Signal Flow Lines Connecting Tiers with Directional Arrowheads -->
  <path d="M 260 300 L 297 300" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrowEmerald)" />
  <path d="M 535 300 L 572 300" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowSky)" />
  <path d="M 815 240 L 847 222" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrowGreen)" />
  <path d="M 815 370 L 847 412" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrowPurple)" />

  <!-- ================= TIER 1: CLIENT EDGE ================= -->
  <g id="tier-1" transform="translate(35, 95)">
    <rect width="225" height="470" rx="14" fill="url(#clientGrad)" stroke="#059669" stroke-width="1.8" filter="url(#cardShadow)" />
    
    <!-- Header -->
    <rect x="0" y="0" width="225" height="52" rx="14" fill="#064e3b" fill-opacity="0.8" />
    <circle class="beacon" cx="22" cy="26" r="6" fill="#34d399" />
    <text x="38" y="33" class="font-mono" font-size="18" font-weight="900" fill="#a7f3d0">1. CLIENT EDGE</text>

    <!-- Step 1A: Raw Document Input -->
    <g transform="translate(14, 68)">
      <rect width="197" height="92" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1.2" />
      <text x="14" y="30" font-size="19" font-weight="900" fill="#f4f4f5">ID / Passport</text>
      <rect x="10" y="44" width="177" height="38" rx="6" fill="#450a0a" fill-opacity="0.9" stroke="#ef4444" stroke-width="1.4" />
      <text x="16" y="70" class="font-mono" font-size="16" font-weight="900" fill="#fca5a5">🔒 0 PII LEAKS</text>
    </g>

    <!-- Step 1B: Blake3 Hashing -->
    <g transform="translate(14, 172)">
      <rect width="197" height="114" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1.2" />
      <text x="14" y="30" font-size="18" font-weight="900" fill="#34d399">Blake3 Hash</text>
      <rect x="10" y="44" width="177" height="58" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <text x="16" y="68" class="font-mono" font-size="16" font-weight="800" fill="#38bdf8">doc_hash</text>
      <text x="16" y="90" class="font-mono" font-size="15" font-weight="800" fill="#a78bfa">+ Blinding Salt</text>
    </g>

    <!-- Step 1C: Emitted Payload -->
    <g transform="translate(14, 298)">
      <rect width="197" height="156" rx="8" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1.6" />
      <text x="14" y="30" class="font-mono" font-size="17" font-weight="900" fill="#34d399">PAYLOAD OUT:</text>
      <text x="14" y="64" class="font-mono" font-size="16" font-weight="800" fill="#ffffff">• doc_hash</text>
      <text x="14" y="94" class="font-mono" font-size="16" font-weight="800" fill="#ffffff">• threshold: 21</text>
      <text x="14" y="124" class="font-mono" font-size="16" font-weight="800" fill="#ffffff">• session_nonce</text>
    </g>
  </g>

  <!-- ================= TIER 2: API GATEWAY ================= -->
  <g id="tier-2" transform="translate(305, 95)">
    <rect width="230" height="470" rx="14" fill="url(#gatewayGrad)" stroke="#4338ca" stroke-width="1.8" filter="url(#cardShadow)" />
    
    <!-- Header -->
    <rect x="0" y="0" width="230" height="52" rx="14" fill="#1e1b4b" fill-opacity="0.85" />
    <circle class="beacon" cx="22" cy="26" r="6" fill="#818cf8" />
    <text x="38" y="33" class="font-mono" font-size="18" font-weight="900" fill="#c7d2fe">2. API GATEWAY</text>

    <!-- Gateway 2A: Session Nonce -->
    <g transform="translate(14, 68)">
      <rect width="202" height="92" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1.2" />
      <text x="14" y="30" class="font-mono" font-size="17" font-weight="900" fill="#818cf8">GET /v1/session</text>
      <text x="14" y="56" class="font-mono" font-size="16" font-weight="800" fill="#ffffff">Anti-Replay Nonce</text>
      <text x="14" y="78" class="font-mono" font-size="15" font-weight="800" fill="#34d399">TTL: 300 Seconds</text>
    </g>

    <!-- Gateway 2B: Constant Time -->
    <g transform="translate(14, 172)">
      <rect width="202" height="114" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1.2" />
      <text x="14" y="30" font-size="18" font-weight="900" fill="#c084fc">Timing Shield</text>
      <text x="14" y="58" class="font-mono" font-size="16" font-weight="800" fill="#e9d5ff">constant_time</text>
      <text x="14" y="82" class="font-mono" font-size="16" font-weight="800" fill="#38bdf8">Linux Sandbox</text>
      <text x="14" y="102" font-size="14" font-weight="700" fill="#94a3b8">0 Side-Channel Leak</text>
    </g>

    <!-- Gateway 2C: Security Guard -->
    <g transform="translate(14, 298)">
      <rect width="202" height="156" rx="8" fill="#1e1b4b" fill-opacity="0.45" stroke="#6366f1" stroke-width="1.6" />
      <text x="14" y="30" class="font-mono" font-size="17" font-weight="900" fill="#a5b4fc">SECURITY SHIELD:</text>
      <text x="14" y="64" class="font-mono" font-size="16" font-weight="800" fill="#ffffff">✓ Token Bucket</text>
      <text x="14" y="94" class="font-mono" font-size="16" font-weight="800" fill="#ffffff">✓ API Key Guard</text>
      <text x="14" y="124" class="font-mono" font-size="16" font-weight="800" fill="#ffffff">✓ Strict CSP Head</text>
      <text x="14" y="146" class="font-mono" font-size="15" font-weight="900" fill="#34d399">→ Fast Dispatch</text>
    </g>
  </g>

  <!-- ================= TIER 3: RUST CORE ================= -->
  <g id="tier-3" transform="translate(580, 95)">
    <rect width="235" height="470" rx="14" fill="url(#engineGrad)" stroke="#0284c7" stroke-width="1.8" filter="url(#cardShadow)" />
    
    <!-- Header -->
    <rect x="0" y="0" width="235" height="52" rx="14" fill="#0c4a6e" fill-opacity="0.8" />
    <circle class="beacon" cx="22" cy="26" r="6" fill="#38bdf8" />
    <text x="38" y="33" class="font-mono" font-size="18" font-weight="900" fill="#bae6fd">3. AEGIS RUST CORE</text>

    <!-- Engine 3A: ZK Circuit Evaluator -->
    <g transform="translate(14, 68)">
      <rect width="207" height="92" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1.2" />
      <text x="14" y="30" font-size="18" font-weight="900" fill="#38bdf8">ZK Groth16</text>
      <text x="14" y="56" class="font-mono" font-size="16" font-weight="800" fill="#cbd5e1">Range Check BN254</text>
      <rect x="8" y="64" width="191" height="24" rx="4" fill="#0369a1" fill-opacity="0.4" stroke="#0284c7" stroke-width="1" />
      <text x="14" y="81" class="font-mono" font-size="15" font-weight="900" fill="#7dd3fc">Rule: (Age ≥ 21)</text>
    </g>

    <!-- Engine 3B: Memory Scrubbing ZEROIZE -->
    <g transform="translate(14, 172)">
      <rect class="zeroize-badge" width="207" height="114" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1.6" />
      <text x="14" y="32" font-size="18" font-weight="900" fill="#dcfce7">⚡ ZEROIZE MEMORY</text>
      <text x="14" y="60" class="font-mono" font-size="16" font-weight="800" fill="#bbf7d0">zeroize(&amp;witness)</text>
      <text x="14" y="86" font-size="16" font-weight="900" fill="#ffffff">RAM Reset: 0x00</text>
      <text x="14" y="104" font-size="13" font-weight="700" fill="#86efac">0 Forensic Residue</text>
    </g>

    <!-- Engine 3C: Post-Quantum Hybrid -->
    <g transform="translate(14, 298)">
      <rect width="207" height="156" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <text x="14" y="30" font-size="18" font-weight="900" fill="#a78bfa">Post-Quantum</text>
      <text x="14" y="60" class="font-mono" font-size="16" font-weight="800" fill="#c4b5fd">FIPS 204 ML-DSA</text>
      <text x="14" y="86" font-size="16" font-weight="700" fill="#ffffff">+ Ed25519 Hybrid</text>
      <rect x="8" y="102" width="191" height="42" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.4" />
      <text x="14" y="129" class="font-mono" font-size="18" font-weight="900" fill="#34d399">SPEED: &lt;150 µs</text>
    </g>
  </g>

  <!-- ================= TIER 4: OUTPUT RECEIPT TIERS ================= -->
  <g id="tier-4" transform="translate(855, 95)">
    <!-- 4A: Signed JWT Verifier Token -->
    <g transform="translate(0, 0)">
      <rect width="190" height="225" rx="14" fill="url(#clientGrad)" stroke="#10b981" stroke-width="1.8" filter="url(#cardShadow)" />
      <rect x="0" y="0" width="190" height="48" rx="14" fill="#064e3b" fill-opacity="0.8" />
      <circle cx="18" cy="24" r="6" fill="#34d399" />
      <text x="32" y="31" class="font-mono" font-size="17" font-weight="900" fill="#a7f3d0">4A. JWT TOKEN</text>

      <g transform="translate(12, 54)">
        <text x="0" y="20" font-size="18" font-weight="900" fill="#34d399">Signed Token</text>
        <rect x="0" y="28" width="166" height="82" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <text x="10" y="52" class="font-mono" font-size="16" font-weight="800" fill="#ffffff">verified: true</text>
        <text x="10" y="76" class="font-mono" font-size="16" font-weight="800" fill="#ffffff">age_over_21</text>
        <text x="10" y="100" class="font-mono" font-size="16" font-weight="900" fill="#34d399">pii_stored: 0</text>

        <rect x="0" y="118" width="166" height="44" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="10" y="145" class="font-mono" font-size="16" font-weight="800" fill="#38bdf8">POST /v1/verify</text>
      </g>
    </g>

    <!-- 4B: Append-Only Merkle Block Ledger -->
    <g transform="translate(0, 240)">
      <rect width="190" height="230" rx="14" fill="url(#ledgerGrad)" stroke="#9333ea" stroke-width="1.8" filter="url(#cardShadow)" />
      <rect x="0" y="0" width="190" height="48" rx="14" fill="#581c87" fill-opacity="0.8" />
      <circle cx="18" cy="24" r="6" fill="#c084fc" />
      <text x="32" y="31" class="font-mono" font-size="17" font-weight="900" fill="#f3e8ff">4B. MERKLE</text>

      <g transform="translate(12, 54)">
        <text x="0" y="20" font-size="18" font-weight="900" fill="#c084fc">Blake3 Ledger</text>
        <rect x="0" y="28" width="166" height="82" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <text x="10" y="52" class="font-mono" font-size="16" font-weight="800" fill="#cbd5e1">Block Receipt</text>
        <text x="10" y="76" class="font-mono" font-size="16" font-weight="800" fill="#a78bfa">Root: 0x9e12...b2</text>
        <text x="10" y="100" class="font-mono" font-size="16" font-weight="900" fill="#34d399">Proof: O(log N)</text>

        <rect x="0" y="118" width="166" height="46" rx="6" fill="#2e1065" fill-opacity="0.6" stroke="#6b21a8" stroke-width="1" />
        <text x="10" y="146" class="font-mono" font-size="16" font-weight="900" fill="#d8b4fe">POST /v1/merkle</text>
      </g>
    </g>
  </g>

  <!-- Bottom Legend Footer -->
  <g transform="translate(40, 584)">
    <circle cx="6" cy="6" r="5" fill="#10b981" />
    <text x="18" y="12" class="font-mono" font-size="16" font-weight="700" fill="#e2e8f0">
      CLIENT EDGE HASH
    </text>

    <circle cx="240" cy="6" r="5" fill="#6366f1" />
    <text x="254" y="12" class="font-mono" font-size="16" font-weight="700" fill="#e2e8f0">
      GATEWAY ISOLATION
    </text>

    <circle cx="480" cy="6" r="5" fill="#0284c7" />
    <text x="494" y="12" class="font-mono" font-size="16" font-weight="700" fill="#e2e8f0">
      RUST ZK CIRCUIT
    </text>

    <circle cx="700" cy="6" r="5" fill="#22c55e" />
    <text x="714" y="12" class="font-mono" font-size="16" font-weight="900" fill="#34d399">
      ZEROIZE SCRUB
    </text>

    <circle cx="910" cy="6" r="5" fill="#a855f7" />
    <text x="924" y="12" class="font-mono" font-size="16" font-weight="700" fill="#e2e8f0">
      MERKLE AUDIT
    </text>
  </g>
</svg>
