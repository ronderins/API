<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="zkBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f" />
      <stop offset="100%" stop-color="#0f1219" />
    </linearGradient>

    <!-- Danger Gradient (Legacy) -->
    <linearGradient id="dangerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#18181b" stop-opacity="0.4" />
    </linearGradient>

    <!-- Success Gradient (Aegis) -->
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#18181b" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <style>
    @keyframes alertPulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; filter: drop-shadow(0 0 10px #ef4444); }
    }
    @keyframes greenPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; filter: drop-shadow(0 0 10px #34d399); }
    }
    @keyframes aegisShieldGlow {
      0%, 100% { stroke: #10b981; stroke-opacity: 0.6; }
      50% { stroke: #34d399; stroke-opacity: 1; filter: drop-shadow(0 0 8px rgba(52, 211, 153, 0.6)); }
    }
    @keyframes breachPulse {
      0%, 100% { stroke: #ef4444; stroke-opacity: 0.5; }
      50% { stroke: #f87171; stroke-opacity: 1; filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.6)); }
    }
    .alert-led {
      animation: alertPulse 1.8s ease-in-out infinite;
    }
    .green-led {
      animation: greenPulse 1.8s ease-in-out infinite;
    }
    .honeypot-card {
      animation: breachPulse 2.5s ease-in-out infinite;
    }
    .aegis-shield-card {
      animation: aegisShieldGlow 2.5s ease-in-out infinite;
    }
    text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
    }
  </style>

  <!-- Background Base -->
  <rect width="1080" height="500" fill="url(#zkBgGrad)" rx="16" />
  <rect x="1" y="1" width="1078" height="498" fill="none" stroke="#27272a" stroke-width="1.5" rx="15" />

  <!-- Top Title & Subtitle -->
  <g transform="translate(40, 46)">
    <text x="0" y="0" font-size="32" font-weight="900" fill="#f4f4f5" letter-spacing="-0.5">
      Zero-Knowledge vs. Traditional Identity Verification
    </text>
    <text x="0" y="28" font-size="17" font-weight="600" fill="#94a3b8">
      Contrasting legacy centralized PII honeypots with Aegis mathematical zero-knowledge proofs.
    </text>
  </g>

  <!-- ================= LEFT COLUMN: TRADITIONAL IDENTITY VENDOR (HONEYPOT) ================= -->
  <g transform="translate(40, 92)">
    <rect class="honeypot-card" width="480" height="350" rx="14" fill="url(#dangerGrad)" stroke="#ef4444" stroke-width="1.8" />
    
    <!-- Header -->
    <rect x="0" y="0" width="480" height="50" rx="14" fill="#450a0a" fill-opacity="0.9" />
    <circle class="alert-led" cx="22" cy="25" r="6" fill="#ef4444" />
    <text x="38" y="32" class="font-mono" font-size="17" font-weight="900" fill="#fca5a5">
      TRADITIONAL (HONEYPOT MODEL)
    </text>

    <!-- Sub-row 1: Data Submission -->
    <g transform="translate(16, 60)">
      <rect width="448" height="74" rx="8" fill="#18181b" stroke="#3f1414" stroke-width="1.2" />
      <text x="14" y="28" font-size="18" font-weight="900" fill="#f87171">1. RAW PII OVER NETWORK</text>
      <text x="14" y="54" class="font-mono" font-size="16" font-weight="800" fill="#fca5a5">Uploads: Full Name, SSN, Passport, Face</text>
    </g>

    <!-- Sub-row 2: Centralized Storage -->
    <g transform="translate(16, 144)">
      <rect width="448" height="92" rx="8" fill="#18181b" stroke="#3f1414" stroke-width="1.2" />
      <text x="14" y="28" font-size="18" font-weight="900" fill="#f87171">2. CENTRALIZED PII DATABASE</text>
      <text x="14" y="52" font-size="16" font-weight="700" fill="#e2e8f0">Stored in cloud disks indefinitely</text>
      <rect x="12" y="60" width="424" height="26" rx="4" fill="#7f1d1d" fill-opacity="0.8" stroke="#ef4444" stroke-width="1.2" />
      <text x="18" y="78" class="font-mono" font-size="15" font-weight="900" fill="#fee2e2">⚠️ HIGH TARGET FOR RANSOMWARE</text>
    </g>

    <!-- Sub-row 3: Repercussions -->
    <g transform="translate(16, 246)">
      <rect width="448" height="88" rx="8" fill="#260b0b" stroke="#7f1d1d" stroke-width="1.2" />
      <text x="14" y="26" class="font-mono" font-size="16" font-weight="900" fill="#f87171">LEGAL &amp; BUSINESS RISKS:</text>
      <text x="14" y="52" font-size="16" font-weight="800" fill="#fca5a5">❌ GDPR / CCPA 4% Global Fines</text>
      <text x="14" y="74" font-size="16" font-weight="800" fill="#fca5a5">❌ 40%+ Customer Abandonment Rate</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: AEGIS ZERO-KNOWLEDGE ENGINE ================= -->
  <g transform="translate(560, 92)">
    <rect class="aegis-shield-card" width="480" height="350" rx="14" fill="url(#successGrad)" stroke="#10b981" stroke-width="1.8" />
    
    <!-- Header -->
    <rect x="0" y="0" width="480" height="50" rx="14" fill="#064e3b" fill-opacity="0.9" />
    <circle class="green-led" cx="22" cy="25" r="6" fill="#34d399" />
    <text x="38" y="32" class="font-mono" font-size="17" font-weight="900" fill="#a7f3d0">
      AEGIS ZERO-KNOWLEDGE (ZERO-PII)
    </text>

    <!-- Sub-row 1: Client Hashing -->
    <g transform="translate(16, 60)">
      <rect width="448" height="74" rx="8" fill="#18181b" stroke="#065f46" stroke-width="1.2" />
      <text x="14" y="28" font-size="18" font-weight="900" fill="#34d399">1. DEVICE-SIDE HASH &amp; BLIND</text>
      <text x="14" y="54" class="font-mono" font-size="16" font-weight="800" fill="#6ee7b7">doc_hash = Blake3(ID) • 0 PII leaves device</text>
    </g>

    <!-- Sub-row 2: Cryptographic Predicate -->
    <g transform="translate(16, 144)">
      <rect width="448" height="92" rx="8" fill="#18181b" stroke="#065f46" stroke-width="1.2" />
      <text x="14" y="28" font-size="18" font-weight="900" fill="#38bdf8">2. ZERO-KNOWLEDGE PROOF</text>
      <text x="14" y="52" class="font-mono" font-size="16" font-weight="800" fill="#93c5fd">ZK Constraint: (Age ≥ 21) • Groth16</text>
      <rect x="12" y="60" width="424" height="26" rx="4" fill="#064e3b" fill-opacity="0.85" stroke="#10b981" stroke-width="1.2" />
      <text x="18" y="78" class="font-mono" font-size="15" font-weight="900" fill="#dcfce7">⚡ RAM ZEROIZED: zeroize(&amp;mut witness)</text>
    </g>

    <!-- Sub-row 3: Verifiable Receipt -->
    <g transform="translate(16, 246)">
      <rect width="448" height="88" rx="8" fill="#062e24" stroke="#059669" stroke-width="1.2" />
      <text x="14" y="26" class="font-mono" font-size="16" font-weight="900" fill="#34d399">AEGIS ASSURANCE &amp; LATENCY:</text>
      <text x="14" y="52" font-size="16" font-weight="800" fill="#a7f3d0">🛡️ 0 Bytes Stored: Zero Subpoena Target</text>
      <text x="14" y="74" font-size="16" font-weight="800" fill="#a7f3d0">⚡ 150 µs Latency: Instant User Conversion</text>
    </g>
  </g>

  <!-- Bottom Divider Line -->
  <g transform="translate(40, 465)">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#27272a" stroke-width="1.2" />
    <text x="0" y="20" class="font-mono" font-size="16" font-weight="700" fill="#cbd5e1">
      PROOF GUARANTEES: <tspan fill="#38bdf8" font-weight="900">ZK Groth16</tspan> • <tspan fill="#34d399" font-weight="900">Blake3 Receipts</tspan> • <tspan fill="#a78bfa" font-weight="900">Post-Quantum ML-DSA</tspan> • <tspan fill="#4ade80" font-weight="900">RAM Zeroize</tspan>
    </text>
  </g>
</svg>
