<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%">
  <defs>
    <linearGradient id="merkleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#0e1017" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="rootGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="activeNodeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <filter id="merkleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulsePath {
      0% { stroke-dashoffset: 80; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes nodeBeacon {
      0%, 100% { r: 6; opacity: 1; filter: drop-shadow(0 0 6px #10b981); }
      50% { r: 4.5; opacity: 0.5; filter: none; }
    }
    @keyframes rootGlowAnim {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.7)); }
      50% { filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.3)); }
    }

    .active-branch {
      stroke-dasharray: 6 4;
      animation: pulsePath 1.6s linear infinite;
    }
    .proof-node {
      animation: nodeBeacon 2s ease-in-out infinite;
    }
    .root-node {
      animation: rootGlowAnim 3s ease-in-out infinite;
    }

    text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
    }
  </style>

  <!-- Background Base -->
  <rect width="960" height="360" fill="url(#merkleBg)" rx="16" />
  <rect x="1" y="1" width="958" height="358" fill="none" stroke="#27272a" stroke-width="1.5" rx="15" />

  <!-- Title & Subtitle -->
  <g transform="translate(40, 36)">
    <text x="0" y="0" font-size="20" font-weight="700" fill="#f4f4f5" letter-spacing="-0.5">
      Append-Only Blake3 Merkle Block Ledger
    </text>
    <text x="420" y="-1" class="font-mono" font-size="11" fill="#38bdf8">
      // LOGARITHMIC O(log N) INCLUSION PROOF VERIFICATION
    </text>
    <text x="0" y="20" font-size="12" fill="#71717a">
      Every proof commitment is sealed in an immutable hash chain. Anyone can verify inclusion without reading others' data.
    </text>
  </g>

  <!-- ================= MERKLE TREE GRAPHIC ================= -->
  <g transform="translate(60, 90)">
    <!-- Tree Branch Lines -->
    <!-- Root to Level 1 -->
    <path d="M 280 40 L 160 110" stroke="#38bdf8" stroke-width="2" class="active-branch" />
    <path d="M 280 40 L 400 110" stroke="#3f3f46" stroke-width="1.5" />

    <!-- Level 1 to Level 2 (Leaves) -->
    <path d="M 160 110 L 100 180" stroke="#10b981" stroke-width="2.5" class="active-branch" />
    <path d="M 160 110 L 220 180" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 4" />
    <path d="M 400 110 L 340 180" stroke="#3f3f46" stroke-width="1.5" />
    <path d="M 400 110 L 460 180" stroke="#3f3f46" stroke-width="1.5" />

    <!-- ROOT NODE -->
    <g transform="translate(280, 40)" class="root-node">
      <rect x="-85" y="-22" width="170" height="44" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.8" />
      <text x="0" y="-4" class="font-mono" font-size="9" font-weight="700" fill="#7dd3fc" text-anchor="middle">MERKLE ROOT</text>
      <text x="0" y="12" class="font-mono" font-size="10" font-weight="700" fill="#f0f9ff" text-anchor="middle">0x8f3c...b29a</text>
    </g>

    <!-- LEVEL 1 NODES -->
    <!-- Left Branch (Active Proof Branch) -->
    <g transform="translate(160, 110)">
      <rect x="-65" y="-18" width="130" height="36" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <text x="0" y="-2" class="font-mono" font-size="8" font-weight="600" fill="#6ee7b7" text-anchor="middle">Hash(Node 0, 1)</text>
      <text x="0" y="11" class="font-mono" font-size="8.5" fill="#a7f3d0" text-anchor="middle">0x4a11...7e88</text>
    </g>

    <!-- Right Branch (Sibling Branch) -->
    <g transform="translate(400, 110)">
      <rect x="-65" y="-18" width="130" height="36" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
      <text x="0" y="-2" class="font-mono" font-size="8" font-weight="600" fill="#71717a" text-anchor="middle">Hash(Node 2, 3)</text>
      <text x="0" y="11" class="font-mono" font-size="8.5" fill="#a1a1aa" text-anchor="middle">0x9d2c...10fe</text>
    </g>

    <!-- LEAF NODES -->
    <!-- Leaf 0: TARGET VERIFICATION RECEIPT -->
    <g transform="translate(100, 180)">
      <rect x="-60" y="-18" width="120" height="42" rx="6" fill="#022c22" stroke="#34d399" stroke-width="2" />
      <circle class="proof-node" cx="-45" cy="0" r="5" fill="#34d399" />
      <text x="10" y="-3" class="font-mono" font-size="8.5" font-weight="700" fill="#34d399" text-anchor="middle">TARGET PROOF</text>
      <text x="10" y="11" class="font-mono" font-size="8" fill="#e2e8f0" text-anchor="middle">Leaf #1042 (P0)</text>
    </g>

    <!-- Leaf 1: Sibling Leaf -->
    <g transform="translate(220, 180)">
      <rect x="-55" y="-18" width="110" height="42" rx="6" fill="#2e1065" stroke="#a855f7" stroke-width="1.2" />
      <text x="0" y="-3" class="font-mono" font-size="8" font-weight="600" fill="#d8b4fe" text-anchor="middle">Audit Sibling</text>
      <text x="0" y="11" class="font-mono" font-size="8" fill="#c084fc" text-anchor="middle">Leaf #1043 (P1)</text>
    </g>

    <!-- Leaf 2: Inactive Leaf -->
    <g transform="translate(340, 180)">
      <rect x="-50" y="-16" width="100" height="36" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="0" y="-2" class="font-mono" font-size="8" fill="#71717a" text-anchor="middle">Leaf #1044 (P2)</text>
      <text x="0" y="10" class="font-mono" font-size="7.5" fill="#52525b" text-anchor="middle">0x81ef...</text>
    </g>

    <!-- Leaf 3: Inactive Leaf -->
    <g transform="translate(460, 180)">
      <rect x="-50" y="-16" width="100" height="36" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="0" y="-2" class="font-mono" font-size="8" fill="#71717a" text-anchor="middle">Leaf #1045 (P3)</text>
      <text x="0" y="10" class="font-mono" font-size="7.5" fill="#52525b" text-anchor="middle">0x62cc...</text>
    </g>
  </g>

  <!-- ================= RIGHT PANEL: INCLUSION PROOF EXPLANATION ================= -->
  <g transform="translate(600, 85)">
    <rect width="320" height="235" rx="10" fill="#131720" stroke="#1e293b" stroke-width="1" />
    
    <g transform="translate(18, 24)">
      <text x="0" y="0" class="font-mono" font-size="11" font-weight="700" fill="#38bdf8">HOW PROOF VERIFICATION WORKS:</text>
      
      <g transform="translate(0, 20)">
        <text x="0" y="0" font-size="10.5" font-weight="600" fill="#f4f4f5">1. Sibling Path Transmission</text>
        <text x="0" y="14" font-size="9" fill="#94a3b8">The prover transmits only the target leaf and adjacent audit sibling hashes (log2 N nodes).</text>
      </g>

      <g transform="translate(0, 60)">
        <text x="0" y="0" font-size="10.5" font-weight="600" fill="#34d399">2. Deterministic SIMD Blake3 Fold</text>
        <text x="0" y="14" class="font-mono" font-size="8.5" fill="#6ee7b7">H = Blake3(Leaf_1042 || Sibling_1043)</text>
        <text x="0" y="27" class="font-mono" font-size="8.5" fill="#6ee7b7">Root_test = Blake3(H || Sibling_Right)</text>
      </g>

      <g transform="translate(0, 115)">
        <text x="0" y="0" font-size="10.5" font-weight="600" fill="#c084fc">3. Constant-Time Equality Check</text>
        <text x="0" y="14" font-size="9" fill="#94a3b8">If Root_test == Published_Ledger_Root, the receipt is mathematically proven to be genuine.</text>
      </g>

      <rect x="-4" y="150" width="292" height="34" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-width="0.8" />
      <text x="6" y="165" class="font-mono" font-size="9" font-weight="700" fill="#a7f3d0">AUDIT ENDPOINT:</text>
      <text x="6" y="177" class="font-mono" font-size="8.5" fill="#dcfce7">POST /api/v1/verify-merkle → { verified: true }</text>
    </g>
  </g>
</svg>
