<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="merkleBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f" />
      <stop offset="50%" stop-color="#0f111a" />
      <stop offset="100%" stop-color="#08090d" />
    </linearGradient>

    <!-- Node Glow -->
    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes branchPulse {
      0%, 100% { stroke: #10b981; stroke-width: 2.5; }
      50% { stroke: #34d399; stroke-width: 4.5; filter: drop-shadow(0 0 8px #10b981); }
    }
    @keyframes targetGlow {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.04); filter: drop-shadow(0 0 12px #34d399); }
    }
    .active-branch {
      animation: branchPulse 2.5s ease-in-out infinite;
    }
    .proof-target {
      animation: targetGlow 2.5s ease-in-out infinite;
      transform-origin: center;
    }
    text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
    }
  </style>

  <!-- Background Base -->
  <rect width="1080" height="430" fill="url(#merkleBgGrad)" rx="16" />
  <rect x="1" y="1" width="1078" height="428" fill="none" stroke="#27272a" stroke-width="1.5" rx="15" />

  <!-- Top Title & Subtitle -->
  <g transform="translate(40, 46)">
    <text x="0" y="0" font-size="32" font-weight="900" fill="#f4f4f5" letter-spacing="-0.5">
      Blake3 Merkle Ledger &amp; Cryptographic Inclusion Proofs
    </text>
    <text x="0" y="28" font-size="17" font-weight="600" fill="#94a3b8">
      Cryptographic verification that an attestation exists on-chain with zero PII disclosure.
    </text>
  </g>

  <!-- ================= LEFT TREE DIAGRAM ================= -->
  <g transform="translate(40, 92)">
    <!-- Active Branches (Highlighted Path) -->
    <path d="M 310 40 L 170 120" fill="none" class="active-branch" />
    <path d="M 170 120 L 100 200" fill="none" class="active-branch" />
    
    <!-- Secondary Branches -->
    <path d="M 310 40 L 450 120" fill="none" stroke="#3f3f46" stroke-width="2" stroke-dasharray="4 4" />
    <path d="M 170 120 L 240 200" fill="none" stroke="#a855f7" stroke-width="2.2" />
    <path d="M 450 120 L 380 200" fill="none" stroke="#27272a" stroke-width="1.8" />
    <path d="M 450 120 L 520 200" fill="none" stroke="#27272a" stroke-width="1.8" />

    <!-- ROOT NODE -->
    <g transform="translate(310, 40)">
      <rect x="-105" y="-28" width="210" height="56" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="2.2" filter="url(#nodeGlow)" />
      <text x="0" y="-3" class="font-mono" font-size="17" font-weight="900" fill="#a7f3d0" text-anchor="middle">MERKLE ROOT</text>
      <text x="0" y="19" class="font-mono" font-size="16" font-weight="800" fill="#6ee7b7" text-anchor="middle">0x9e12...b2</text>
    </g>

    <!-- LEVEL 1 NODES -->
    <!-- Left Branch (Active Proof Branch) -->
    <g transform="translate(170, 120)">
      <rect x="-95" y="-26" width="190" height="52" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2" />
      <text x="0" y="-3" class="font-mono" font-size="16" font-weight="800" fill="#6ee7b7" text-anchor="middle">Hash(Node 0, 1)</text>
      <text x="0" y="18" class="font-mono" font-size="15" font-weight="800" fill="#a7f3d0" text-anchor="middle">0x4a11...7e</text>
    </g>

    <!-- Right Branch (Sibling Branch) -->
    <g transform="translate(450, 120)">
      <rect x="-90" y="-26" width="180" height="52" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1.6" />
      <text x="0" y="-3" class="font-mono" font-size="16" font-weight="800" fill="#cbd5e1" text-anchor="middle">Hash(Node 2, 3)</text>
      <text x="0" y="18" class="font-mono" font-size="15" font-weight="700" fill="#94a3b8" text-anchor="middle">0x9d2c...10</text>
    </g>

    <!-- LEAF NODES -->
    <!-- Leaf 0: TARGET VERIFICATION RECEIPT -->
    <g transform="translate(100, 204)" class="proof-target">
      <rect x="-80" y="-28" width="160" height="56" rx="8" fill="#022c22" stroke="#34d399" stroke-width="2.8" />
      <circle cx="-58" cy="0" r="7" fill="#34d399" />
      <text x="12" y="-4" class="font-mono" font-size="16" font-weight="900" fill="#34d399" text-anchor="middle">TARGET PROOF</text>
      <text x="12" y="18" class="font-mono" font-size="15" font-weight="800" fill="#f4f4f5" text-anchor="middle">Leaf #1042 (P0)</text>
    </g>

    <!-- Leaf 1: Sibling Leaf -->
    <g transform="translate(245, 204)">
      <rect x="-70" y="-28" width="140" height="56" rx="8" fill="#2e1065" stroke="#a855f7" stroke-width="2" />
      <text x="0" y="-4" class="font-mono" font-size="16" font-weight="900" fill="#d8b4fe" text-anchor="middle">Sibling</text>
      <text x="0" y="18" class="font-mono" font-size="15" font-weight="800" fill="#c084fc" text-anchor="middle">Leaf #1043</text>
    </g>

    <!-- Leaf 2: Inactive Leaf -->
    <g transform="translate(385, 204)">
      <rect x="-65" y="-26" width="130" height="52" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1.4" />
      <text x="0" y="-3" class="font-mono" font-size="15" font-weight="700" fill="#a1a1aa" text-anchor="middle">Leaf #1044</text>
      <text x="0" y="17" class="font-mono" font-size="15" font-weight="700" fill="#71717a" text-anchor="middle">0x81ef...</text>
    </g>

    <!-- Leaf 3: Inactive Leaf -->
    <g transform="translate(520, 204)">
      <rect x="-65" y="-26" width="130" height="52" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1.4" />
      <text x="0" y="-3" class="font-mono" font-size="15" font-weight="700" fill="#a1a1aa" text-anchor="middle">Leaf #1045</text>
      <text x="0" y="17" class="font-mono" font-size="15" font-weight="700" fill="#71717a" text-anchor="middle">0x62cc...</text>
    </g>
  </g>

  <!-- ================= RIGHT PANEL: INCLUSION PROOF EXPLANATION ================= -->
  <g transform="translate(670, 95)">
    <rect width="370" height="265" rx="14" fill="#131720" stroke="#1e293b" stroke-width="1.6" />
    
    <g transform="translate(22, 28)">
      <text x="0" y="0" class="font-mono" font-size="17" font-weight="900" fill="#38bdf8">HOW AUDIT PROOF WORKS:</text>
      
      <g transform="translate(0, 28)">
        <text x="0" y="0" font-size="18" font-weight="900" fill="#f4f4f5">1. Sibling Path</text>
        <text x="0" y="22" class="font-mono" font-size="16" font-weight="800" fill="#ffffff">Logarithmic O(log N) path</text>
      </g>

      <g transform="translate(0, 84)">
        <text x="0" y="0" font-size="18" font-weight="900" fill="#34d399">2. SIMD Blake3</text>
        <text x="0" y="22" class="font-mono" font-size="16" font-weight="800" fill="#6ee7b7">H = Blake3(Leaf || Sibling)</text>
      </g>

      <g transform="translate(0, 142)">
        <text x="0" y="0" font-size="18" font-weight="900" fill="#c084fc">3. Fast Verification</text>
        <text x="0" y="22" class="font-mono" font-size="16" font-weight="800" fill="#e9d5ff">Root.ct_eq(&amp;Published)</text>
        <text x="0" y="44" font-size="15" font-weight="900" fill="#34d399">Speed: &lt;10 µs per check</text>
      </g>
    </g>
  </g>

  <!-- Bottom Divider Line -->
  <g transform="translate(40, 395)">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#27272a" stroke-width="1.2" />
    <text x="0" y="20" class="font-mono" font-size="16" font-weight="700" fill="#cbd5e1">
      LEDGER GUARANTEE: <tspan fill="#34d399" font-weight="900">Append-Only</tspan> • <tspan fill="#38bdf8" font-weight="900">SIMD Blake3 Tree</tspan> • <tspan fill="#a78bfa" font-weight="900">O(log N) Proofs</tspan>
    </text>
  </g>
</svg>
