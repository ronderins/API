<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="merkleBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0c1117" />
      <stop offset="100%" stop-color="#080a0f" />
    </linearGradient>

    <!-- Theme #73C7B8 Gradients -->
    <linearGradient id="themeTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ee2d6" />
      <stop offset="100%" stop-color="#73C7B8" />
    </linearGradient>

    <linearGradient id="rootBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123831" />
      <stop offset="100%" stop-color="#0c231f" />
    </linearGradient>

    <linearGradient id="targetBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15423a" />
      <stop offset="100%" stop-color="#0d2823" />
    </linearGradient>
  </defs>

  <style>
    @keyframes flowVerify {
      from { stroke-dashoffset: 24; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes subtleBeacon {
      0%, 100% { opacity: 0.65; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px #73C7B8); }
    }
    @keyframes hashClimb1 {
      0% { transform: translate(0, 0); opacity: 0; }
      15% { opacity: 1; }
      48% { transform: translate(75px, -86px); opacity: 1; }
      52% { transform: translate(75px, -86px); opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translate(215px, -170px); opacity: 0; }
    }
    .active-flow {
      stroke: #73C7B8;
      stroke-width: 2.6;
      stroke-dasharray: 6 6;
      animation: flowVerify 1.5s linear infinite;
    }
    .status-beacon {
      animation: subtleBeacon 2s ease-in-out infinite;
    }
    .hash-pulse-particle {
      animation: hashClimb1 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
    }
  </style>

  <!-- Background Base Container -->
  <rect width="1080" height="470" fill="url(#merkleBgGrad)" rx="16" />
  <rect x="1" y="1" width="1078" height="468" fill="none" stroke="#1e293b" stroke-width="1.5" rx="15" />

  <!-- Top Title & Description Header -->
  <g transform="translate(45, 42)">
    <text x="0" y="0" font-size="26" font-weight="900" fill="#f8fafc" letter-spacing="-0.5">
      Blake3 Merkle Ledger &amp; Cryptographic Inclusion Receipts
    </text>
    <text x="0" y="26" font-size="14" font-weight="500" fill="#94a3b8">
      Mathematical non-repudiation: verifying an attestation receipt in $O(\log N)$ without exposing any other user proof.
    </text>
  </g>

  <!-- ================= LEFT: MERKLE PROOF TREE ================= -->
  <g transform="translate(45, 95)">
    <!-- Active Verified Proof Branches (Animated Dash Flow & Traveling Hash Pulse) -->
    <path d="M 310 44 L 170 128" fill="none" class="active-flow" />
    <path d="M 170 128 L 95 214" fill="none" class="active-flow" />
    <circle class="hash-pulse-particle" cx="95" cy="214" r="5.5" fill="#73C7B8" filter="drop-shadow(0 0 8px #73C7B8)" />

    <!-- Inactive & Sibling Static Branches -->
    <path d="M 310 44 L 450 128" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="4 4" />
    <path d="M 170 128 L 245 214" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="3 3" />
    <path d="M 450 128 L 385 214" fill="none" stroke="#1e293b" stroke-width="1.6" />
    <path d="M 450 128 L 525 214" fill="none" stroke="#1e293b" stroke-width="1.6" />

    <!-- LEVEL 0: MERKLE ROOT -->
    <g transform="translate(310, 44)">
      <rect x="-105" y="-26" width="210" height="52" rx="10" fill="url(#rootBoxGrad)" stroke="#73C7B8" stroke-width="2" />
      <circle cx="-85" cy="0" r="4.5" fill="#73C7B8" class="status-beacon" />
      <text x="8" y="-3" class="font-mono" font-size="14" font-weight="900" fill="#9ee2d6" text-anchor="middle">MERKLE ROOT</text>
      <text x="8" y="17" class="font-mono" font-size="13" font-weight="700" fill="#73C7B8" text-anchor="middle">0x9e12...b2</text>
    </g>

    <!-- LEVEL 1: INTERMEDIATE HASH NODES -->
    <!-- Left Node (Verified Path Intermediate) -->
    <g transform="translate(170, 128)">
      <rect x="-95" y="-24" width="190" height="48" rx="8" fill="#0d2823" stroke="#73C7B8" stroke-width="1.8" />
      <text x="0" y="-3" class="font-mono" font-size="13" font-weight="800" fill="#9ee2d6" text-anchor="middle">Hash(Leaf 0, Leaf 1)</text>
      <text x="0" y="16" class="font-mono" font-size="12" font-weight="700" fill="#73C7B8" text-anchor="middle">0x4a11c8...7e</text>
    </g>

    <!-- Right Node (Inactive Subtree) -->
    <g transform="translate(450, 128)">
      <rect x="-90" y="-24" width="180" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.4" />
      <text x="0" y="-3" class="font-mono" font-size="13" font-weight="700" fill="#cbd5e1" text-anchor="middle">Hash(Leaf 2, Leaf 3)</text>
      <text x="0" y="16" class="font-mono" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">0x9d2cb4...10</text>
    </g>

    <!-- LEVEL 2: LEAF ATTESTATIONS -->
    <!-- Leaf 0: TARGET VERIFIED ATTESTATION -->
    <g transform="translate(95, 214)">
      <rect x="-78" y="-26" width="156" height="52" rx="8" fill="url(#targetBoxGrad)" stroke="#73C7B8" stroke-width="2.2" />
      <circle cx="-58" cy="0" r="5" fill="#73C7B8" class="status-beacon" />
      <text x="10" y="-3" class="font-mono" font-size="13" font-weight="900" fill="#73C7B8" text-anchor="middle">TARGET PROOF</text>
      <text x="10" y="17" class="font-mono" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">Leaf #1042 (P0)</text>
    </g>

    <!-- Leaf 1: SIBLING AUDIT LEAF -->
    <g transform="translate(245, 214)">
      <rect x="-68" y="-24" width="136" height="48" rx="8" fill="#131d24" stroke="#475569" stroke-width="1.6" />
      <text x="0" y="-3" class="font-mono" font-size="13" font-weight="800" fill="#94a3b8" text-anchor="middle">Sibling Audit</text>
      <text x="0" y="16" class="font-mono" font-size="12" font-weight="700" fill="#cbd5e1" text-anchor="middle">Leaf #1043</text>
    </g>

    <!-- Leaf 2: Inactive -->
    <g transform="translate(385, 214)">
      <rect x="-62" y="-24" width="124" height="48" rx="8" fill="#0b0f17" stroke="#1e293b" stroke-width="1.2" />
      <text x="0" y="-3" class="font-mono" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Leaf #1044</text>
      <text x="0" y="15" class="font-mono" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">0x81ef40...</text>
    </g>

    <!-- Leaf 3: Inactive -->
    <g transform="translate(525, 214)">
      <rect x="-62" y="-24" width="124" height="48" rx="8" fill="#0b0f17" stroke="#1e293b" stroke-width="1.2" />
      <text x="0" y="-3" class="font-mono" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Leaf #1045</text>
      <text x="0" y="15" class="font-mono" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">0x62cc9a...</text>
    </g>
  </g>

  <!-- ================= RIGHT: AUDIT INCLUSION VERIFICATION PANEL ================= -->
  <g transform="translate(640, 95)">
    <rect width="395" height="260" rx="12" fill="#0c1219" stroke="#1e293b" stroke-width="1.5" />
    
    <g transform="translate(24, 28)">
      <text x="0" y="0" class="font-mono" font-size="13" font-weight="900" fill="#73C7B8" letter-spacing="1">
        CRYPTOGRAPHIC INCLUSION VERIFICATION
      </text>
      
      <!-- Step 1 -->
      <g transform="translate(0, 26)">
        <text x="0" y="0" font-size="14" font-weight="800" fill="#f8fafc">1. Sibling Inclusion Path</text>
        <text x="0" y="18" class="font-mono" font-size="12" font-weight="600" fill="#94a3b8">
          Only $O(\log N)$ sibling hashes required to verify.
        </text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 78)">
        <text x="0" y="0" font-size="14" font-weight="800" fill="#73C7B8">2. SIMD Blake3 Compression</text>
        <text x="0" y="18" class="font-mono" font-size="12" font-weight="700" fill="#9ee2d6">
          H = Blake3(TargetLeaf || SiblingHash)
        </text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 132)">
        <text x="0" y="0" font-size="14" font-weight="800" fill="#f8fafc">3. Constant-Time Root Equality</text>
        <text x="0" y="18" class="font-mono" font-size="12" font-weight="700" fill="#cbd5e1">
          Root.ct_eq(&amp;PublishedRoot) == true
        </text>
        <rect x="0" y="28" width="180" height="24" rx="4" fill="#123831" stroke="#73C7B8" stroke-width="1" />
        <text x="10" y="44" class="font-mono" font-size="11" font-weight="900" fill="#73C7B8">
          ⚡ Latency: &lt;10 µs per check
        </text>
      </g>
    </g>
  </g>

  <!-- ================= BOTTOM LEDGER GUARANTEE BAR ================= -->
  <g transform="translate(45, 400)">
    <line x1="0" y1="0" x2="990" y2="0" stroke="#1e293b" stroke-width="1.2" />
    <text x="0" y="28" class="font-mono" font-size="13" font-weight="600" fill="#94a3b8">
      LEDGER GUARANTEE: <tspan fill="#73C7B8" font-weight="800">Append-Only</tspan> &nbsp;•&nbsp; <tspan fill="#73C7B8" font-weight="800">SIMD Blake3 Tree</tspan> &nbsp;•&nbsp; <tspan fill="#9ee2d6" font-weight="800">O(log N) Tamper-Proof Receipts</tspan> &nbsp;•&nbsp; <tspan fill="#f8fafc" font-weight="800">Zero PII Stored</tspan>
    </text>
  </g>
</svg>
