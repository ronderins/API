name: CI/CD & Security Verification

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  nextjs-frontend:
    name: Next.js Frontend CI & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Lint Next.js
        run: npm run lint

      - name: Build Next.js Application
        run: npm run build
        env:
          NODE_ENV: production

  rust-engine:
    name: Rust Privacy-Preserving Engine Test & Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-api
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust-api/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-api/Cargo.lock', 'rust-api/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format Check
        run: cargo fmt --check

      - name: Clippy Linter
        run: cargo clippy -- -D warnings

      - name: Run Cryptographic Unit Tests
        run: cargo test --verbose

  docker-build:
    name: Docker Container Build Check
    runs-on: ubuntu-latest
    needs: [nextjs-frontend, rust-engine]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Next.js Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: zk-auth-web:latest

      - name: Build Rust Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./rust-api
          file: ./rust-api/Dockerfile
          push: false
          tags: zk-auth-rust:latest
