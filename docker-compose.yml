version: '3.8'

services:
  # Next.js Full-Stack Web Frontend & Edge API Proxy
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zk-auth-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - RUST_BACKEND_URL=http://rust-api:8080
      - API_KEY=test-api-key-12345
    depends_on:
      - rust-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Rust ZK-Identity High Performance Cryptographic Verification Engine
  rust-api:
    build:
      context: ./rust-api
      dockerfile: Dockerfile
    container_name: zk-auth-rust-engine
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - RUST_LOG=zk_identity_api_rust=info,tower_http=info
      - API_KEY=test-api-key-12345
      - JWT_SECRET=zkp-identity-verification-master-key-32b
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
